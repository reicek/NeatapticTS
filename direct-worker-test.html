<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#060b14;color:#fff;height:100vh}canvas{flex:1;width:100%;height:100%;image-rendering:pixelated}</style></head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  canvas.width = 640; canvas.height = 480;
  const off = canvas.transferControlToOffscreen();
  const w = new Worker('/docs/assets/neatenstein.worker.js');
  w.onmessage = e => console.log('main got', e.data);
  w.onerror = e => console.error('worker error', e);
  w.postMessage({ type: 'init', tier: 'worker', version: 'neatenstein-frame-v1', mapSeed: 1, canvas: off, canvasWidth: 640, canvasHeight: 480 }, [off]);
  setTimeout(() => {
    console.log('sending simState');
    w.postMessage({ type: 'simState', state: { canvasWidth: 640, canvasHeight: 480, simTick: 1, cameraX: 60.5, cameraY: 60.5, cameraYaw: 0, mapSeed: 1, movement: {forward:false,backward:false,left:false,right:false}, enemies: [] } });
  }, 1000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ASCII Maze (NeatapticTS)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../../docs/assets/theme.css" />
  <script defer src="../../docs/assets/theme-tooltips.js"></script>
</head>
<body class="demo-page">
  <main class="demo-main demo-main--wide">
    <section class="hero">
      <p class="eyebrow">Flagship Browser Demo</p>
      <h1>ASCII Maze</h1>
      <p>
        This page runs the real browser-hosted curriculum loop: the controller starts in a
        compact maze, advances through larger procedural layouts, and keeps the live ASCII
        search trace visible while telemetry-rich evolution unfolds.
      </p>
    </section>

    <p id="ascii-maze-status" class="load-status" role="status" aria-live="polite">
      Loading ASCII Maze browser bundle...
    </p>
    <section class="starter-demo-shell">
      <!-- Internal pause control removed; external host can supply controls using the public API -->
      <div id="ascii-maze-output">
        <div id="ascii-maze-live"></div>
        <div id="ascii-maze-archive"></div>
      </div>
    </section>
  </main>
  <script>
    (function loadAsciiMazeBundle() {
      const statusElement = document.getElementById('ascii-maze-status');
      const currentPath = window.location.pathname.replace(/\\/g, '/');
      const isRepositoryExamplePath = /\/examples\//.test(currentPath) && !/\/docs\/examples\//.test(currentPath);
      const bundleSrc = isRepositoryExamplePath
        ? '../../docs/assets/ascii-maze.bundle.js'
        : '../../assets/ascii-maze.bundle.js';

      const scriptElement = document.createElement('script');
      scriptElement.src = bundleSrc;
      scriptElement.defer = true;
      scriptElement.onload = () => {
        const startFunction = window.asciiMaze?.start || window.asciiMazeStart;

        if (!startFunction) {
          if (statusElement) {
            statusElement.textContent = 'Bundle loaded, but no ASCII Maze start function was found.';
          }
          return;
        }

        Promise.resolve(startFunction('ascii-maze-output'))
          .then(() => {
            if (statusElement) {
              statusElement.textContent = '';
            }
          })
          .catch((error) => {
            if (statusElement) {
              statusElement.textContent = error instanceof Error
                ? error.message
                : String(error);
            }
          });
      };
      scriptElement.onerror = () => {
        if (statusElement) {
          statusElement.textContent = `Failed to load ascii-maze.bundle.js from ${bundleSrc}. Run npm run build:ascii-maze.`;
        }
      };

      document.body.appendChild(scriptElement);
    })();
  </script>
  <script>
    // Minimal fallback status if start not invoked automatically (e.g., API change)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        try {
          if (!(window.asciiMazeStart || (window.asciiMaze && window.asciiMaze.start))) {
            const s = document.getElementById('ascii-maze-status');
            if (s) s.textContent = 'Bundle loaded but start API not found.';
          }
        } catch {}
      }, 1000);
    });
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Flappy Bird (NEAT demo)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;overflow:hidden}
    body{
      font-family:system-ui,Segoe UI,Arial,sans-serif;
      background:#060b14;
      color:#9fdcff;
      display:flex;
      flex-direction:column;
      box-sizing:border-box;
      min-height:100dvh;
      border:4px double #0fb5ff;
      padding:24px;
      box-shadow:inset 0 0 0 1px rgba(159,220,255,.22), inset 0 0 24px rgba(15,181,255,.12);
      overflow:hidden;
    }
    header{padding:0 0 8px 0}
    main{flex:1;display:flex;flex-direction:column;padding:0;gap:8px;min-height:0;overflow:hidden}
    #flappy-bird-output{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:0;overflow:hidden}
    #status{min-height:20px;padding:6px 10px;color:#ff9a2e;background:#000;border-top:1px solid #0fb5ff}
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0;font-size:18px">Flappy Bird (NEAT demo)</h1>
  </header>
  <main>
    <div id="flappy-bird-output"></div>
    <div id="status" aria-live="polite"></div>

    <script
      src="../../assets/flappy-bird.bundle.js?v=20260226"
      defer
      onload="(window.flappyBirdStart ? window.flappyBirdStart('flappy-bird-output') : (window.flappyBird && window.flappyBird.start && window.flappyBird.start()))"
      onerror="document.getElementById('status').textContent='Failed to load flappy-bird.bundle.js';"
    ></script>
  </main>
</body>
</html>

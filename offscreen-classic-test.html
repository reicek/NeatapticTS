<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body{margin:0;background:#060b14;color:#fff;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{flex:1;min-width:0;min-height:0;width:100%;height:100%;image-rendering:pixelated}
</style></head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  canvas.width = 640; canvas.height = 480;
  const off = canvas.transferControlToOffscreen();
  const w = new Worker('./offscreen-classic-worker.js');
  w.postMessage({ canvas: off }, [off]);
  w.onmessage = function(e) { console.log('worker', e.data); };
</script>
</body>
</html>

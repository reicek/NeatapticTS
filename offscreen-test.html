<!doctype html>
<html><body>
<canvas id="c" width="400" height="300" style="width:400px;height:300px;background:#000;"></canvas>
<script>
const canvas = document.getElementById('c');
const off = canvas.transferControlToOffscreen();
const blob = new Blob([`
self.onmessage = (e) => {
  if (e.data.type === 'init') {
    const canvas = e.data.canvas;
    canvas.width = 400; canvas.height = 300;
    const ctx = canvas.getContext('2d');
    let frame = 0;
    function draw(){
      frame++;
      ctx.fillStyle = 'rgb('+(frame%255)+',100,100)';
      ctx.fillRect(0,0,400,300);
      ctx.fillStyle='#fff';
      ctx.fillText('frame '+frame, 20, 50);
      self.postMessage({frame});
      requestAnimationFrame(draw);
    }
    draw();
  }
};
`], {type:'application/javascript'});
const url = URL.createObjectURL(blob);
const worker = new Worker(url, {type:'module'});
worker.postMessage({type:'init', canvas: off}, [off]);
worker.onmessage = e => { console.log('frame', e.data.frame); };
</script>
</body></html>

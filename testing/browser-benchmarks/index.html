<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NeatapticTS Browser Bench</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../docs/assets/theme.css" />
  </head>
  <body class="bench-page">
    <main>
      <section class="hero bench-shell">
        <p class="eyebrow">Browser Benchmark</p>
        <h1>NeatapticTS Browser Bench</h1>
        <p>This page runs the browser benchmark bundle against the current workspace build and emits the serialized result to the console for automated collection.</p>
      </section>
      <p id="status" class="load-status bench-status">Running…</p>
    </main>
    <script>
      window.__BENCH_MODE__ = '__MODE__';
    </script>
    <script src="./__BUNDLE__"></script>
    <script>
      const s = document.getElementById('status');
      setTimeout(() => {
        s.textContent = 'Done';
        console.log(
          '[NEATAPTIC_BROWSER_BENCH_RESULTS]',
          JSON.stringify(window.__NEATAPTIC_BENCH__)
        );
      }, 50);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
    {
      "imports": {
        "/docs/dist/neataptic.browser.esm.js": "/dist/neataptic.browser.esm.js",
        "child_process": "/docs/browser-tests/stubs/child-process-stub.mjs",
        "path": "/docs/browser-tests/stubs/path-stub.mjs"
      }
    }
    </script>
  </head>
  <body>
    <p id="status">Running...</p>
    <script type="module">
      import { runNGETierBenchmark } from './scenarios/webgpu-nge-tier-throughput.mjs';
      document.getElementById('status').textContent = 'Module loaded';
      (async () => {
        try {
          const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
          document.getElementById('status').textContent = 'Adapter ok';
          const device = await adapter.requestDevice();
          const result = await runNGETierBenchmark({ device, adapter, tiers: [64] });
          window.ngeTierBenchmarkResult = result;
          document.getElementById('status').textContent = 'Done';
        } catch (e) {
          document.getElementById('status').textContent = 'Error: ' + e;
          window.ngeTierBenchmarkResult = { success:false, error: String(e) };
        }
      })();
    </script>
  </body>
</html>

<script>
(function () {
  'use strict';
  var result = {
    passed: false,
    bundleLoaded: false,
    neatRacingStartDefined: false,
    canvasMounted: false,
    hudMounted: false,
    modeSwitchedToManual: false,
    webglOk: false,
    consoleErrors: [],
    networkFailures: [],
    checks: {},
    // The ACTUAL number of named checks in result.checks, computed from the
    // object itself (never the expected number).
    checkCount: 0,
    // The ACTUAL names of the named checks, published next to the count so
    // the gate can assert the exact SET and not only the total.
    checkNames: [],
    notes: ''
  };
  window.p1TurnDriftGreenSmokeResult = result;

  window.addEventListener('error', function (e) {
    result.consoleErrors.push('error: ' + String(e.message));
  });
  window.addEventListener('unhandledrejection', function (e) {
    result.consoleErrors.push('unhandledrejection: ' + String(e.reason));
  });
  var origConsoleError = console.error;
  console.error = function () {
    result.consoleErrors.push(Array.from(arguments).map(String).join(' '));
    return origConsoleError.apply(this, arguments);
  };

  var shaderSources = new Map();
  var programSources = new Map();
  var locationName = new Map();
  var currentProgram = null;
  var currentArrayBuffer = null;
  var gridDraws = 0;
  var trackDraws = 0;
  var shadowDraws = 0;
  var capturedGridSpacing = null;
  var capturedTrackVboData = null;
  var carLitModelsThisFrame = [];
  var litDrawBufferIdsThisFrame = [];
  var wheelBufferIdsSeen = new Map();
  var gridProgram = null;
  var trackProgram = null;
  var bufferDataMap = new Map();
  var shadowColorFeeds = [];
  var shadowModelScales = [];
  var tireGradientApplySequence = [];
  var currentTireGradientApply = 0;
  var litApplyThisFrame = [];
  // Parallel to litDrawBufferIdsThisFrame: true when the lit draw came from
  // the CAR lit program. The car lit program is the only program that
  // declares uApplyTireGradient (the track lit program and the right-world
  // prop program do not), so this flag isolates the car draws inside the
  // shared lit-draw stream.
  var litDrawIsCarLitThisFrame = [];
  // The uApplyTireGradient values of the CAR lit draws only, in draw order.
  // The lit stream is shared by the track, the right-world props and the
  // car, so the tire-gradient contract must be read from the car draws
  // alone: per car and frame the pattern is [0, 1, 1, 1, 1] (body mesh
  // without the gradient, four wheel meshes with it).
  var carLitApplySequence = [];
  // AC-078 measurement state: the tire-to-body relative yaw and the
  // tire-to-body offset heading, sampled at rest (the baseline) and during
  // the high-speed drift phase. The tires are ATTACHED, so both must stay
  // constant while the body yaws into the slide.
  var relativeYawA = [];
  var relativeYawWA = [];
  var relativeOffsetA = [];
  var relativeOffsetWA = [];
  var maxSpeedKmhDrift = 0;
  var maxSpeedKmhAccel = 0;
  // AC-078: the peak drift-angle proxy (the body's rendered yaw versus the
  // direction of travel) plus the rolling body samples used to derive the
  // travel direction from a multi-sample chord.
  var maxDriftProxyRad = 0;
  var driftProxyFrameCount = 0;
  var driftProxyRunFrames = 0;
  var driftProxyRunMaxFrames = 0;
  var driftProxySamples = [];
  // 14N drift-feel measurement state (the P0-P6 phase sequence). The
  // browser-computable observables (the body-to-travel angle and its sign)
  // are measured on a SEPARATE rolling window, so the retained W+A
  // measurement (maxDriftProxyRad, driftProxyRunMaxFrames) is never
  // perturbed by the new phases.
  var feelProxySamples = [];
  // The per-frame SIGNED body-to-travel angle of the new phases. The log
  // is the evidence behind the far-side pop, the sign consistency and the
  // slide prominence, so every one of those measurements is auditable
  // after the run.
  var feelProxyLog = [];
  var feelProxyMaxRad = 0;
  var feelProxyFrameCount = 0;
  var feelProxyRunMaxFrames = 0;
  var feelPhases = {};
  // The per-frame seam samples of the new phases. The seam carries exactly
  // EIGHT fields (poseRad, poseRateRadPerS, slipAngleRad, speedMps, tickHz,
  // tick, followOffsetRad - the chase-camera follow offset, added by Step
  // 14P - and tractionSeverity - the PUBLISHED traction severity, added by
  // Step 14Q2); the phase label, the frame index, the wall-clock stamp and
  // the body position are the FIXTURE's own bookkeeping.
  var feelSeamSamples = [];
  // Step 14R: the FIELD-COUNT ASSERTION state. The seam READER owns the
  // eight-field contract, so it COUNTS the fields the seam actually
  // publishes and the run only passes when the count is EXACTLY eight (a
  // seam with seven means the writer never landed; a seam with nine means
  // a field grew without a re-base record). The observed count and the
  // number of observations are published next to the check count, so the
  // gate can assert the exact SET and not only the total.
  var observedSeamFieldCount = 0;
  var observedSeamFieldSamples = 0;
  // Step 14R: the HUD TRACTION READOUT element. The overlay paints the
  // PUBLISHED traction severity as a whole percent ('Traction 42%') on
  // its FOURTH label (the order the production appends them in: speed,
  // lap, time, traction, hint - examples/neatRacing/host/hud.ts), and
  // the fixture READS that text to compare the rendered readout against
  // the PUBLISHED severity on the seam. The fixture NEVER re-derives the
  // severity: it compares the two PUBLISHED numbers.
  var hudTractionLabel = null;
  // The AC-079 comparable capture pair: the capture point of P1 and the
  // capture point of P2 (both at the SAME tick budget, so the two speeds
  // are comparable). The speed trace makes a polluted capture diagnosable.
  // A null capture means the capture point was never reached.
  var straightCaptureSpeedKmh = null;
  var driftCaptureSpeedKmh = null;
  var straightCaptureX = null;
  var straightCaptureZ = null;
  var driftCaptureX = null;
  var driftCaptureZ = null;
  // The capture TICKS (the simulation tick the capture was taken at) and
  // the REGIME evidence of each capture: the distance to the nearest road
  // vertex (the road is 30 m wide, so the half-width is 13.5-16.5 m) and
  // the HUD cross-check of the seam speed. The browser has no surface
  // classifier, so this geometry measurement IS the regime evidence.
  var straightCaptureTick = null;
  var driftCaptureTick = null;
  var straightCaptureRoadDistanceM = null;
  var driftCaptureRoadDistanceM = null;
  var straightCaptureHudKmh = null;
  var driftCaptureHudKmh = null;
  var straightCaptureSlipRad = null;
  var driftCaptureSlipRad = null;
  // The road vertices of the captured track VBO (published by
  // analyzeTrackVbo), so a capture point can be classified as ON-ROAD or
  // OFF-ROAD.
  var capturedRoadPoints = [];
  // The tick budget each phase actually ran (the MEASURED tick delta), so
  // the notes show that the phase budgets are TICK budgets and not frame
  // budgets.
  var feelPhaseTickDeltas = {};
  // The input alignment log (the tick-aligned key dispatch): every flip
  // records the tick it was issued on, the tick it landed on and whether
  // the simulation clock had advanced when the flip was issued.
  var feelInputAlignment = [];
  // The throttle state the fixture believes it holds, so the speed
  // governor never re-dispatches the same key every frame.
  var feelThrottleDown = false;
  var feelSpeedTrace = [];
  // The countersteer key order. The release MUST come first, so the order is
  // recorded and the checks can read the fact.
  var countersteerKeyOrder = [];
  var mirrorKeyOrder = [];
  var countersteerReleasedBeforePress = false;
  var mirrorReleasedBeforePress = false;
  // The uTireGradient* fragment-stage capture (AC-088). It is DEFENSIVE: a
  // uniform that is never fed leaves its slot undefined and the dependent
  // check reports false - it never throws.
  var tireGradientBrightFactor = undefined;
  var tireGradientDarkFactor = undefined;
  var tireGradientRadius = undefined;
  var tireGradientThreshold = undefined;
  var tireGradientApplyEnabled = false;
  // AC-078 tolerance: the attached tire must keep the same relative pose to
  // the body while the body yaws into the slide. The float32 matrix noise is
  // ~1e-5 rad, so 0.002 rad is a tight but safe band (the drift yaw reaches
  // several hundredths of a radian).
  var TIRE_YAW_FOLLOW_TOLERANCE_RAD = 0.002;
  // AC-079: the tires must actually LOSE TRACTION proportionally during a
  // full-speed drift. The arcade top speed is 89 m/s (~320 km/h); the old
  // model held that whole top speed through any turn because the tires
  // never gave up any forward grip. A sustained hard turn that stays below
  // this ceiling proves the forward grip was spent on the slide.
  //
  // 14N (D1.3 and D3.1 line 107, RE-SEMANTIC + RE-PIN): the ceiling is
  // RE-PINNED strictly ABOVE the scenario top speed so it stops being the
  // binding constraint. The retained 290 km/h figure is NOT carried
  // forward: it was a ceiling-only artifact, never a measurement.
  //
  // GAP-N4 D1.3 (the ratified scrub coefficient 0.55, which SUPERSEDES the
  // projected 0.25): the scrub max is 22.0275 m/s2, which is ABOVE the
  // 17.8 m/s2 engine, so the SCRUB wins above the 4/9 (about 0.444444)
  // SCRUB-COEFFICIENT crossover (the engine wins while c <= 4/9, and the
  // interior equilibrium is s* = sqrt(3520.4444 / c) = 80.0 m/s at
  // c = 0.55) - the drift phase no longer holds the arcade
  // top speed through the turn. MEASURED on the final bytes: the drift
  // terminal speed is 79.85793 m/s = 287.49 km/h, i.e. a 32.91146 km/h
  // deficit against the 320.4 km/h straight-line top speed (32.55473 km/h
  // at the 600-tick capture). The ceiling stays a LOOSE bound: 340 km/h
  // clears the 320.4 km/h top speed by about 6 percent, so it is not the
  // deciding term - the DEFICIT form below is the contract.
  var TRACTION_LOSS_MAX_SPEED_KMH = 340;
  // AC-079 (D1.3): the NEW named export NEATRACING_DRIFT_MIN_SPEED_DEFICIT_KMH
  // (owned by the tune-model slice, examples/neatRacing/physics/drift.model.ts)
  // is MIRRORED here, exactly the way TRACK_LIT_FLOATS_PER_VERTEX mirrors
  // NEATRACING_TRACK_LIT_FLOATS_PER_VERTEX in engine/passes/track.pass.ts.
  // The mirror has to live in the fixture because the debug seam is FIXED
  // at seven fields (poseRad, slipAngleRad, speedMps, tickHz, tick,
  // followOffsetRad, tractionSeverity) and cannot carry a constant.
  //
  // Derivation (RED-DECIDED, plans/neatracing-voxel-racer.logs.md - the 14N
  // rebaseline-risk coverage note - D1.3 and D3.1, ratified
  // by the GAP-N4 D1.3 decision):
  //  - the OLD model's deficit at the two comparable capture points was
  //    MEASURED in the jest lane at 112.26 km/h (straight 600 ticks =
  //    320.4 km/h against drift 600 ticks = 208.14 km/h);
  //  - the NEW model's deficit (scrub coefficient 0.55) is now MEASURED
  //    and no longer projected: 32.55473 km/h at the 600-tick capture and
  //    32.91146 km/h at the 1200-tick terminal (the scrub max is
  //    22.0275 m/s2, above the 17.8 m/s2 engine);
  //  - the floor is pinned at 20 km/h as a NON-VACUOUS lower bound that the
  //    measured NEW-model deficit has to clear (20 is about 0.61x the
  //    measured 32.55 km/h deficit and about 0.18x the measured old-model
  //    deficit).
  // BLOCKING RULE: if the measured new-model deficit falls BELOW 20 km/h
  // then the MODEL is at fault and not the floor - the step BLOCKS and
  // escalates through 00.cross-tier-helper. The floor is NEVER silently
  // relaxed and the ceiling is NEVER silently re-pinned.
  var DRIFT_MIN_SPEED_DEFICIT_KMH = 20;
  // The arcade drift only engages above 15 m/s (54 km/h), so the scenario
  // must reach that speed for the tire-yaw contract to be exercised at all.
  var DRIFT_MIN_SPEED_KMH = 54;
  // AC-078 scenario gate: the phase before the drift turn accelerates on the
  // road (throttle only) until the HUD speed passes this target, so the W+A
  // phase starts ABOVE the drift threshold instead of from a standstill.
  var ACCEL_TARGET_SPEED_KMH = 90;
  // Frame budget for the speed-gated acceleration phase. The gate is
  // speed-driven, so the budget only bounds a stalled or off-road run.
  var ACCEL_MAX_FRAMES = 600;
  // The track lit VBO is interleaved position(3) + color(3) + normalAxis(1)
  // = 7 floats per vertex (NEATRACING_TRACK_LIT_FLOATS_PER_VERTEX in
  // engine/passes/track.pass.ts). The fixture must read the same stride.
  var TRACK_LIT_FLOATS_PER_VERTEX = 7;
  // AC-078 drift proxy gate: the body's rendered yaw is compared with the
  // direction of travel. A sliding car travels at a different angle than it
  // points, so a proxy above this threshold proves the drift is engaged (the
  // speed gate alone does not prove a slide). The gate also requires a
  // CONSECUTIVE run of at least DRIFT_PROXY_MIN_FRAMES frames above the
  // threshold, so a single-frame transient cannot decide the phase.
  //
  // 14N (D3.1 line 128, RE-BASELINE - relative, not absolute): the gate is
  // RE-DERIVED from the AC-087 authority so the fixture and the unit live
  // in ONE system: DRIFT_PROXY_MIN_RAD = 0.25 x
  // NEATRACING_DRIFT_MIN_SLIDE_PROXY_RAD = 0.25 x 0.20 = 0.05. The 0.25
  // coefficient is the RED slice's decision (the browser proxy is
  // render-rate dependent, so the browser can only carry a LOOSE fraction
  // of the deterministic unit floor) and the derivation is PINNED here so
  // the gate threshold and the production constant cannot drift apart. The
  // OLD 0.01 rad figure is NOT carried forward.
  var DRIFT_PROXY_MIN_RAD = 0.05;
  // Minimum number of CONSECUTIVE drift-phase frames that must reach
  // DRIFT_PROXY_MIN_RAD for the drift engagement to count (a sustained
  // slide, not a spike).
  //
  // 14N (D3.1 line 132, RE-BASELINE - split): 3 stays for the ENGAGEMENT
  // gate and is NOT moved. The 7f regression guard is the pair
  // (NEATRACING_DRIFT_PROXY_ENGAGEMENT_MIN_RAD, NEATRACING_DRIFT_PROXY_MIN_FRAMES)
  // = (0.01, 3) in the jest lane, and the browser twin
  // (driftGateSurvivesThreeConsecutiveFrames) measures the SAME run length,
  // so the two lanes cannot drift apart.
  var DRIFT_PROXY_MIN_FRAMES = 3;
  // 14N (D3.1 line 132, the NEW half of the split): the AC-087 SUSTAIN is
  // the NEW hold and not the new entry, so it gets its OWN named constant.
  // The value mirrors the unit lane's 120 CONSECUTIVE ticks of a sustained
  // full-speed full-steer turn: 120 browser frames at the 60 Hz fixed
  // timestep is the same 2 s of held slide, so the browser and the unit
  // observe the SAME sustain window. The P2 phase runs 5x this window, so
  // the sustain is observable with margin.
  var DRIFT_PROXY_MIN_HOLD_FRAMES = 120;
  // AC-078 drift proxy window: the travel direction is derived from a chord
  // across this many body samples and is compared against the MEAN OF THE
  // TWO ENDPOINT yaws of the same window. The chord of a circular arc is
  // parallel to the tangent at the arc's mid-angle, and the heading is
  // linear in time for a constant turn rate, so the endpoint mean IS the
  // heading at the chord's temporal mid-point: the mid-window sampling lag
  // cancels EXACTLY for any per-frame tick distribution (the host releases
  // 0-4 simulation ticks per rendered frame). The residual is bounded by the
  // yaw-acceleration term (alpha * T^2 / 8 over the window) plus the
  // speed-variation term, which is <= 0.002 rad at the observed drift speed
  // - 5x below the DRIFT_PROXY_MIN_RAD gate. The scenario itself
  // (the fixed-frame drift phase) stays render-rate dependent - that is
  // pre-existing and out of this contract's scope.
  //
  // 14N (D3.1 line 146, RE-BASELINE the BOUND, keep the WINDOW): the 0.002
  // rad residual above was derived under a LINEAR body-yaw assumption, and
  // the 14N pose spring makes the body yaw SECOND ORDER (zeta = 0.35, so
  // about 31 percent overshoot), so the linear argument is no longer valid
  // and the bound is RE-DERIVED from the overshoot:
  //  - the pose spring runs at omega_n = sqrt(324) = 18 rad/s, so the damped
  //    ring sits at omega_d = 18 * sqrt(1 - 0.35^2) = 16.86 rad/s;
  //  - a step of amplitude A rings down with a first overshoot of
  //    exp(-zeta * pi / sqrt(1 - zeta^2)) = 1.31 x A, so the ring amplitude
  //    after the step is A_ring = 0.31 * A;
  //  - over a 6-frame window (T = 0.1 s at 60 Hz) the endpoint-mean chord
  //    estimator's error on a sinusoid of amplitude A_ring is
  //    A_ring * (omega_d * T)^2 / 8 = 0.31 * A * 0.355 = 0.11 * A, so with
  //    the declared pose envelope (0.30185 rad since the Step 14Q2
  //    re-pin; it read 0.3050 rad before) the residual bound is
  //    0.11 * 0.30185 = 0.0332 rad, rounded DOWN to 0.030 rad (the
  //    rounding is UNCHANGED by the re-pin);
  //  - 0.030 rad is about 15x LOOSER than the linear 0.002 rad assumption
  //    (the bound MUST be looser, because the second-order ring adds energy
  //    the linear argument did not account for) and still 1.7x below the
  //    re-baselined 0.05 rad engagement gate.
  // A too-loose bound fails SILENTLY (RB-13), so the derivation is pinned
  // here instead of being asserted.
  var DRIFT_PROXY_WINDOW = 6;
  // The re-derived endpoint-mean chord residual bound (see the derivation
  // above). It is the proxy's ERROR FLOOR, so a proxy reading is only
  // meaningful above it.
  var DRIFT_PROXY_RESIDUAL_MAX_RAD = 0.03;
  // 14N phase budgets. The P1/P2 pair is the COMPARABLE capture pair of the
  // re-semanticized AC-079 check, so the two phases must have the SAME
  // elapsed SIMULATION count: the capture point is the first frame whose
  // tick delta reaches the budget.
  //
  // 14N W3 (the RC-2 tick conversion, the S3 table of the determinism
  // review): every budget is now a TICK budget, not a FRAME budget. A
  // rendered frame is not a simulation instant - the host releases 0-4
  // simulation ticks per rendered frame - so a frame budget measures a
  // different amount of simulation time on every machine (a 600-tick
  // phase spans about 1622 frames at 163 fps and about 330 frames at 30
  // fps). The budgets keep their VALUES in ticks (1 frame at the 60 Hz
  // fixed timestep = 1 tick), so the tick totals are the ones the jest
  // lane measured.
  //
  // The CAPTURE budget is the one value that is NOT carried over from the
  // 600-frame horizon, and the reason is the ribbon: the browser lane
  // drives a CLOSED loop (the 'large' track bucket, a 240 m radius with
  // a 30 m road), so a straight line cannot be held for 600 ticks (10 s
  // at the top speed is about 890 m, more than three corners of the
  // loop) - the car leaves the ribbon, the off-road floor takes the
  // speed, and the AC-079 capture pair degrades to two off-road speeds
  // whose difference is noise. The determinism review records the same
  // blocker ("the capture horizon is shortened to a tick budget the track
  // can hold") and the browser lane is the LOOSE lane (the two-tier
  // rule), so the capture budget is the shortest horizon that still
  // (a) keeps the car inside the ribbon's straight budget (see
  // FEEL_STRAIGHT_MAX_SPEED_KMH) and (b) holds the D1.3 deficit floor of
  // 20 km/h. The D1.3 FLOOR is NOT relaxed: the capture pair stays
  // internally comparable (both phases run the same tick budget) and the
  // floor is asserted against the measured deficit.
  //
  // 14N W3 (the re-based capture budget, derived against the production
  // simulation): the budget is 210 TICKS and the D1.3 deficit is carried
  // by the SLIDE LENGTH, not by the road regime.
  //
  // The previous 180-tick budget split the regimes on purpose (the
  // straight capture on the ribbon, the drift capture off it), because
  // the on-road scrub was believed to be too weak to reach the 20 km/h
  // floor. The production simulation OVERTURNS that premise: the body
  // yaws INTO the slide, so the slide's world-frame lateral offset at
  // the capture is only 0.05-3.2 m - far inside the 13.5-16.5 m road
  // half-width band - and the regime split was therefore an
  // UNSATISFIABLE witness. The deficit has to be carried by the slide
  // itself, over a long enough slide.
  //
  // The simulation (the compiled physics.step.service + the real 'large'
  // track, seed 42 - the same spec the browser lane drives) measures the
  // re-based pair at this budget: the straight capture 224.28 km/h, the
  // drift capture 198.66 km/h, the DEFICIT 25.62 km/h - 11.42 percent of
  // the straight capture and a 1.28x margin over the 20 km/h floor. The
  // re-entry jitter sweep (the spawn pose and the frame alignment moved
  // over their measured spread) gives a deficit range of 24.10-27.19
  // km/h with 0 violations of the floor.
  //
  // The pair is COMPARABLE BY CONSTRUCTION: both runs start from the
  // SAME fresh spawn state (the ribbon re-entry) and both run the SAME
  // 210-tick budget, so the two capture points sit at the same elapsed
  // simulation tick. The capture window is UNCAPPED (the speed governor
  // only acts AFTER the capture), because a capped capture run and an
  // uncapped one are not comparable: the previous 120 km/h cap on the
  // straight run against an uncapped drift run measured the CAP, not the
  // scrub.
  //
  // The RIBBON STAY: the straight run travels about 109 m and the drift
  // run about 106 m, both inside the first segment's 175.09 m straight,
  // and the drift capture's lateral offset from the centreline is 0.05 m
  // - so BOTH capture points are ON-ROAD (the conservative same-regime
  // witness).
  var SPEED_CAPTURE_TICKS = 210;
  // The POST-CAPTURE speed governor of the straight-line scenario.
  //
  // The CAPTURE window is NOT governed: the two capture points have to
  // be measured at the same free-acceleration speed, so a cap that acts
  // before the capture would compare a capped run against an uncapped
  // one. The cap only acts on the release/settle/straight phases, where
  // it has two jobs: keep the car on the ribbon and keep the drift model
  // engaged (a coasting car drops below the 15 m/s engagement gate, the
  // drift disengages and the pose snaps to zero for the WRONG reason -
  // the vacuous pass the re-based expectation forbids).
  //
  // The cap is 120 km/h: the 210-tick capture leaves the car at about
  // 198.7 km/h, and the release/settle/straight window is 90 ticks
  // (1.5 s), so the governor brings the speed down inside the release
  // window and the settle/straight phases run at about 96-121 km/h (the
  // simulation measures 120.5 km/h at the end of the straight phase).
  // The travel after the capture is about 60 m, so the drift run ends at
  // about 169 m of travel and a 0.87 m lateral offset - inside the
  // 175.09 m straight and inside the road half-width.
  var FEEL_STRAIGHT_MAX_SPEED_KMH = 120;
  // The hysteresis of the speed governor: the throttle is re-applied only
  // below the cap minus this margin, so the governor does not chatter
  // around the cap (the throttle key flip is a per-frame decision).
  var FEEL_SPEED_CAP_HYSTERESIS_KMH = 10;
  // The road half-width band of the 'large' track bucket: the road is 30 m
  // wide with a 10 percent variation, so the half-width is 13.5-16.5 m.
  // A capture point within the WIDE half-width is classified ON-ROAD (the
  // conservative reading: a point that is not classified ON-ROAD is
  // OFF-ROAD, never the other way round).
  //
  // The classification is measured against the RENDERED ribbon (the road
  // mesh's own teal edge and fill vertices), not against the track spec,
  // so it reads the road the browser actually drew. The production
  // simulation measures the drift capture's lateral offset at 0.05 m
  // from the centreline - far inside BOTH bands - so the classification
  // is not the binding evidence of the capture pair.
  var FEEL_ROAD_HALF_WIDTH_MIN_M = 13.5;
  var FEEL_ROAD_HALF_WIDTH_MAX_M = 16.5;
  // The 7b-HOLD floors: the committed slide that the neutral steer HOLDS
  // (the D5 decision) has to be VISIBLE in the hold window. The committed
  // budget is 0.45 rad and the pose target is the committed slip * 0.5
  // (0.225 rad), so the floors sit an order of magnitude below the
  // expected values: they exclude a vanished slide (the 0.02 rad snap
  // band is 10x below the slip floor) without pinning the model.
  var DRIFT_FEEL_HOLD_MIN_SLIP_RAD = 0.2;
  var DRIFT_FEEL_HOLD_MIN_POSE_RAD = 0.05;
  // The snap band of the release: the model zeroes the committed slip when
  // |slip| <= 0.02 rad, so a released slide has to be back inside that
  // band. The band is the PRODUCTION value (the snap band of the
  // commitment model), not a fixture tolerance.
  var DRIFT_FEEL_RELEASE_SLIP_MAX_RAD = 0.02;
  // The straight-line expectation, re-based (14N W3, the D5 re-base). The
  // pose spring has NO snap: its target is the committed slip, so after a
  // release the pose decays asymptotically and an EXACT zero is
  // structurally unreachable. The production simulation measures 0.0607
  // rad at the release and 1.835e-8 rad after a 120-tick settle, so the
  // expectation is "the pose RETURNED to the hard zero" inside the
  // declared 0.002 rad render-jitter headroom.

      var holdEndMs = samples[j].tMs + DRIFT_FEEL_SETTLE_HOLD_MS;
      var held = true;
      var sawEnd = false;
      for (var k = j; k < samples.length; k++) {
        var holdPose = samples[k].poseRad;
        if (typeof holdPose === 'number' && Math.abs(holdPose - baselinePoseRad) > tolRad) {
          held = false;
          break;
        }
        if (samples[k].tMs >= holdEndMs) {
          sawEnd = true;
          break;
        }
      }
      if (held && sawEnd) return { settleMs: samples[j].tMs - catchStartMs, found: true };
    }
    return { settleMs: null, found: false };
  }
  // The far-side pop: the largest excursion of the POSE to the OPPOSITE
  // side of the drift's own sign during the catch phase. The far-side pop
  // is the ONE sanctioned sign flip (the 7a pop contract, measured on the
  // pose because the pose is the quantity the unit lane pins).
  function measureFeelPop(referenceSign, phase) {
    var samples = seamSamplesForPhase(phase);
    var popRad = 0;
    var found = false;
    if (referenceSign === 0) return { popRad: 0, found: false, samples: samples.length };
    for (var i = 0; i < samples.length; i++) {
      var pose = samples[i].poseRad;
      if (typeof pose !== 'number') continue;
      var sign = pose > 0 ? 1 : -1;
      if (sign === referenceSign) continue;
      var absPose = Math.abs(pose);
      if (!found || absPose > popRad) {
        popRad = absPose;
        found = true;
      }
    }
    return { popRad: popRad, found: found, samples: samples.length };
  }
  // The sustained sign of the pose over a phase (the drift's own side).
  function feelPoseReferenceSign(phase) {
    var samples = seamSamplesForPhase(phase);
    var sign = 0;
    for (var i = 0; i < samples.length; i++) {
      var pose = samples[i].poseRad;
      if (typeof pose !== 'number') continue;
      if (sign === 0) sign = pose > 0 ? 1 : -1;
    }
    return sign;
  }
  // Step 14P: the camera follow offset (the SIXTH seam field). The chase
  // camera aims along the PUBLISHED travel direction, so its follow
  // offset CONVERGES on the published slip AS FAR AS THE NAMED CAP
  // ALLOWS and never swings past the SUPPORTED aim (the capped slip).
  //
  // THE MEASUREMENT IS A PARITY MEASUREMENT over the seam's OWN two
  // fields - the published slip and the follow offset - so it is
  // NON-VACUOUS: a camera pinned to the nose reports a zero offset (the
  // floor fails and there is nothing to compare), and a camera that
  // over-rotated past the published travel direction would break the
  // ceiling.
  //
  // THE AIM ERROR is the published slip CAPPED at the named cap minus
  // the follow offset: the camera's aim is the nose heading plus the
  // follow offset and the SUPPORTED travel direction is the nose
  // heading plus the capped published slip, so their difference is
  // exactly the capped slip minus the offset. Under the capped law the
  // aim SATURATES at the cap while the published slide grows past it,
  // so the raw published slip is NOT the direction the camera can
  // reach - the capped slip is. A
  // camera that TRACKS the travel direction closes that error; a camera
  // that never tracks keeps it open.
  // The SIGN is read at the PEAK: the sign of the aim where the aim is
  // LARGEST against the sign of the supported aim there. A PER-SAMPLE
  // sign comparison is LAG-SENSITIVE (the follow can hold the OLD sign
  // for several frames after a mirror while it re-converges) and the
  // sign of a CONVERGED sample is IMPLIED by the convergence arithmetic
  // (a disagreeing sign can never converge), so the sign is measured
  // at the ONE sample where the aim is biggest - the saturated peak,
  // where the aim has long since caught up with the slide's side.
  //
  // The phases are the DRIFT phases only (the two commit/hold pairs).
  // The straight phases carry a zero published slip, so a follow offset
  // measured there would say nothing about the re-wiring. The CEILING
  // bound is taken over the WHOLE run, because the follow is a carried
  // state: it survives the phase boundaries, so its magnitude is bound
  // by the largest SUPPORTED aim (the capped published slip) the WHOLE
  // run produced and not by the largest aim of one phase.
  function measureCameraFollowOffset(phases) {
    var maxAbsRad = 0;
    var maxAbsSlipRad = 0;
    var maxSupportedAimRad = 0;
    var samples = 0;
    var convergedSamples = 0;
    var firstAbsRad = null;
    var peakAbsRad = 0;
    var peakFollowSign = 0;
    var peakSupportedSign = 0;
    var peakSignMismatches = 0;
    for (var i = 0; i < feelSeamSamples.length; i++) {
      var s = feelSeamSamples[i];
      var slip = s.slipAngleRad;
      if (typeof slip === 'number') {
        var absSlipAll = Math.abs(slip);
        if (absSlipAll > maxAbsSlipRad) maxAbsSlipRad = absSlipAll;
        // The SUPPORTED aim: the published slide capped at the named
        // cap. It is the direction the camera can actually reach, so it
        // is the bound the aim is measured against (the raw slide is
        // NOT reachable under the capped law).
        var supportedAll = Math.abs(clampCameraAimOffsetRad(slip));
        if (supportedAll > maxSupportedAimRad) maxSupportedAimRad = supportedAll;
      }
      if (phases.indexOf(s.phase) === -1) continue;
      var follow = s.followOffsetRad;
      if (typeof follow !== 'number') continue;
      samples += 1;
      var absFollow = Math.abs(follow);
      // The FIRST aim of the drift: the aim magnitude the camera
      // carries into the drift (the slide is still zero there), so the
      // TRACKING growth can be measured against it.
      if (firstAbsRad === null) firstAbsRad = absFollow;
      if (absFollow > maxAbsRad) maxAbsRad = absFollow;
      if (typeof slip !== 'number') continue;
      var absSlip = Math.abs(slip);
      // The convergence and the sign: asserted only where the published
      // slide AND the follow offset are both unambiguous.
      if (
        absSlip >= DRIFT_FEEL_CAMERA_FOLLOW_SLIP_FLOOR_RAD &&
        absFollow >= DRIFT_FEEL_CAMERA_FOLLOW_SIGN_MIN_OFFSET_RAD
      ) {
        // The aim error against the SUPPORTED aim: the published slip
        // CAPPED at the named cap, minus the follow offset. Under the
        // capped law the aim SATURATES at the cap while the published
        // slide grows past it, so the aim error against the RAW
        // published slip stays open (about 0.276 rad at the 0.45 rad
        // slide) even though the camera tracks the direction the car is
        // travelling AS FAR AS THE CAP ALLOWS. The convergence is
        // therefore measured against the SUPPORTED aim - the direction
        // the car is travelling, as far as the named cap allows.
        var aimError = clampCameraAimOffsetRad(slip) - follow;
        if (Math.abs(aimError) <= DRIFT_FEEL_CAMERA_FOLLOW_CONVERGED_RAD) {
          convergedSamples += 1;
        }
        // The PEAK SIGN: the aim has to point the SAME WAY as the
        // supported aim where it is LARGEST. A PER-SAMPLE sign
        // comparison is LAG-SENSITIVE (the follow can hold the OLD sign
        // for several frames after a mirror while it re-converges), and
        // the sign of a CONVERGED sample is IMPLIED by the convergence
        // arithmetic (a disagreeing sign can never converge), so the
        // sign is read at the ONE sample where the aim is biggest - the
        // saturated peak, where the aim has long since caught up with
        // the slide's side.
        if (absFollow > peakAbsRad) {
          peakAbsRad = absFollow;
          peakFollowSign = follow > 0 ? 1 : (follow < 0 ? -1 : 0);
          var peakSupported = clampCameraAimOffsetRad(slip);
          peakSupportedSign = peakSupported > 0 ? 1 : (peakSupported < 0 ? -1 : 0);
        }
      }
    }
    if (
      peakFollowSign !== 0 &&
      peakSupportedSign !== 0 &&
      peakFollowSign !== peakSupportedSign
    ) {
      peakSignMismatches = 1;
    }
    // The TRACKING GROWTH: how much the aim grew between the drift's
    // first sample and the drift's peak. A camera that tracks the slide
    // grows its aim from zero to the cap; a camera that ignores the
    // slide (or that carries a constant offset) grows it by nothing.
    var trackingGrowthRad = 0;
    if (firstAbsRad !== null) trackingGrowthRad = maxAbsRad - firstAbsRad;
    return {
      samples: samples,
      maxAbsRad: maxAbsRad,
      maxAbsSlipRad: maxAbsSlipRad,
      maxSupportedAimRad: maxSupportedAimRad,
      convergedSamples: convergedSamples,
      firstAbsRad: firstAbsRad,
      trackingGrowthRad: trackingGrowthRad,
      peakAbsRad: peakAbsRad,
      peakFollowSign: peakFollowSign,
      peakSupportedSign: peakSupportedSign,
      peakSignMismatches: peakSignMismatches
    };
  }

  // Step 14X: the fixture's mirror of the production's aim clamp
  // (`clampChaseCameraFollowOffsetRad`). The cap is SYMMETRIC: it
  // bounds the magnitude of the signed offset, so a left-hand slide and
  // a right-hand slide are bounded by the SAME value.
  function clampCameraAimOffsetRad(offsetRad) {
    var cap = DRIFT_FEEL_CAMERA_MAX_AIM_OFFSET_RAD;
    if (offsetRad > cap) return cap;
    if (offsetRad < -cap) return -cap;
    return offsetRad;
  }
  // Step 14X: the AIM CAP measurement. The aim offset is a CARRIED
  // state (it survives the phase boundaries), so the measurement is
  // taken over the WHOLE run - not over one phase.
  function measureCameraAimOffsetCap() {
    var samples = 0;
    var maxAbsRad = 0;
    for (var i = 0; i < feelSeamSamples.length; i++) {
      var offset = feelSeamSamples[i].followOffsetRad;
      if (typeof offset !== 'number') continue;
      samples += 1;
      var absRad = Math.abs(offset);
      if (absRad > maxAbsRad) maxAbsRad = absRad;
    }
    return { samples: samples, maxAbsRad: maxAbsRad };
  }
  // Step 14X: the camera RELEASE measurement - the evidence the THREE
  // new named checks of this wave read.
  //
  // IT MEASURES THE RESIDUAL, NOT THE AIM. The residual is the part of
  // the aim the PUBLISHED slide no longer supports (the aim minus the
  // capped published slip). The release law closes the RESIDUAL at the
  // named smooth fraction, and the follow closes the SUPPORTED aim at
  // its own proportional rate, so the two are measured apart: the
  // fixture subtracts the follow's OWN pull (mirrored from the named
  // rate formula) from the OBSERVED residual rate, and what is left is
  // the release's own rate.
  //
  // THE MIRROR BELOW IS THE FIXTURE'S VERIFICATION MIRROR of the named
  // rate formula - the same rule the 14Q2 traction severity oracle
  // follows. It is NOT a consumer: no published number is derived from
  // it, and the published aim is NEVER substituted for the published
  // number. It exists so the check can assert a RATE (the release's own
  // share) instead of a FLOOR.
  //
  // THE RELEASE TICKS ARE SELECTED, NOT ASSUMED: a tick counts as a
  // release tick only where the aim was measurably ABOVE the aim the
  // published slide supports. That single condition EXCLUDES the
  // catch-up regime (the aim below the supported aim, where the law is
  // pulling the aim UP, not easing it back) and the far-side pop (the
  // aim on the OTHER side of the supported aim).
  // The measurement never counts a tick it did not measure.
  //
  // THE PRECONDITION: a release tick exists ONLY while the published
  // slide is BELOW the named cap - above the cap the supported aim IS
  // the cap, so the aim can never sit above it and there is no residual
  // to release (the residual is the aim minus the supported aim). The
  // release phases drive the slide down past the cap (the release and
  // the settle follow the committed hold), so the population exists; the
  // observed sub-cap slide range is published in the cameraRelease
  // evidence block so the precondition is EVIDENCED.
  function measureCameraRelease(phases) {
    var samples = 0;
    var releaseTicks = 0;
    var monotonicViolations = 0;
    var signFlips = 0;
    var maxObservedGapRate = 0;
    var maxReleaseRate = 0;
    var largeAimTicks = 0;
    var smallAimTicks = 0;
    var maxReleaseRateLargeAim = 0;
    var maxReleaseRateSmallAim = 0;
    var firstAbsRad = null;
    var lastAbsRad = null;
    var minReleaseSlideRad = null;
    var maxReleaseSlideRad = 0;
    for (var p = 0; p < phases.length; p++) {
      var phaseSamples = seamSamplesForPhase(phases[p]);
      for (var i = 1; i < phaseSamples.length; i++) {
        var prev = phaseSamples[i - 1];
        var cur = phaseSamples[i];
        var prevOffset = prev.followOffsetRad;
        var curOffset = cur.followOffsetRad;
        var slip = cur.slipAngleRad;
        var speed = cur.speedMps;
        var tickHz = cur.tickHz;
        var prevTick = prev.tick;
        var curTick = cur.tick;
        if (typeof prevOffset !== 'number' || typeof curOffset !== 'number') continue;
        if (typeof slip !== 'number' || typeof speed !== 'number') continue;
        if (typeof tickHz !== 'number' || typeof prevTick !== 'number' || typeof curTick !== 'number') continue;
        var ticks = curTick - prevTick;
        // A frame that released no tick holds the aim: it is not a
        // release tick and it is not counted as a sample.
        if (ticks <= 0) continue;
        samples += 1;
        // The REANCHOR guard: the tick-regression reset writes EXACTLY 0
        // into the aim, and a re-anchor is not a release.
        if (curOffset === 0) continue;
        // The SUPPORTED aim: the published slide capped at the named cap.
        var supported = clampCameraAimOffsetRad(slip);
        var supportedAbs = Math.abs(supported);
        var prevAbs = Math.abs(prevOffset);
        var curAbs = Math.abs(curOffset);
        // The aim and the supported aim have to be on the SAME side: an
        // aim on the OTHER side is the far-side pop, not a release.
        if (supported !== 0 && (prevOffset > 0) !== (supported > 0)) continue;
        // The RESIDUAL before the advance: the part of the aim the
        // published slide no longer supports.
        var residualBefore = prevAbs - supportedAbs;
        if (residualBefore <= DRIFT_FEEL_CAMERA_RESIDUAL_FLOOR_RAD) continue;
        releaseTicks += 1;
        if (firstAbsRad === null) firstAbsRad = prevAbs;
        lastAbsRad = curAbs;
        // The PUBLISHED SLIDE the release was measured over: the
        // release population only exists while the published slide is
        // BELOW the named cap (above the cap the supported aim IS the
        // cap and the aim can never be above it, so there is no
        // residual to release). The observed range is published so the
        // precondition is EVIDENCED and not merely asserted.
        var absReleaseSlide = Math.abs(slip);
        if (minReleaseSlideRad === null || absReleaseSlide < minReleaseSlideRad) minReleaseSlideRad = absReleaseSlide;
        if (absReleaseSlide > maxReleaseSlideRad) maxReleaseSlideRad = absReleaseSlide;
        // The MONOTONICITY: a release NEVER grows the aim.
        if (curAbs > prevAbs + DRIFT_FEEL_CAMERA_RELEASE_GROWTH_TOLERANCE_RAD) monotonicViolations += 1;
        // The SIGN: a release NEVER flips the side of the aim.
        if (
          prevAbs >= DRIFT_FEEL_CAMERA_FOLLOW_SIGN_MIN_OFFSET_RAD &&
          curAbs >= DRIFT_FEEL_CAMERA_FOLLOW_SIGN_MIN_OFFSET_RAD &&
          (curOffset > 0) !== (prevOffset > 0)
        ) signFlips += 1;
        // The residual after the advance.
        var residualAfter = curAbs - supportedAbs;
        if (residualAfter < 0) residualAfter = 0;
        // The OBSERVED per-tick rate at which the residual closed. The
        // residual decays geometrically inside a frame (the law applies
        // the SAME descriptor to every tick of the frame), so the rate
        // is the N-th root of the measured decay.
        var observedGapRate = 1 - Math.pow(residualAfter / residualBefore, 1 / ticks);
        if (observedGapRate < 0) observedGapRate = 0;
        if (observedGapRate > maxObservedGapRate) maxObservedGapRate = observedGapRate;
        // The follow's OWN proportional pull: the fixture's verification
        // MIRROR of the named rate formula (the published slide ONLY -
        // the camera's own divergence is not part of the rate).
        var dt = 1 / tickHz;
        var mirroredFollowRate = Math.min(
          1,
          DRIFT_FEEL_CAMERA_FOLLOW_GAIN * speed * Math.abs(slip) * dt
        );
        // The RELEASE's own rate: what is left of the observed residual
        // rate once the follow's own pull is taken out.
        var releaseRate = observedGapRate - mirroredFollowRate;
        if (releaseRate > maxReleaseRate) maxReleaseRate = releaseRate;
        // The two aim-magnitude regimes.
        if (prevAbs >= DRIFT_FEEL_CAMERA_MAX_AIM_OFFSET_RAD * DRIFT_FEEL_CAMERA_LARGE_AIM_FRACTION) {
          largeAimTicks += 1;
          if (releaseRate > maxReleaseRateLargeAim) maxReleaseRateLargeAim = releaseRate;
        } else {
          smallAimTicks += 1;
          if (releaseRate > maxReleaseRateSmallAim) maxReleaseRateSmallAim = releaseRate;
        }
      }
    }
    return {
      samples: samples,
      releaseTicks: releaseTicks,
      monotonicViolations: monotonicViolations,
      signFlips: signFlips,
      maxObservedGapRate: maxObservedGapRate,
      maxReleaseRate: maxReleaseRate,
      largeAimTicks: largeAimTicks,
      smallAimTicks: smallAimTicks,
      maxReleaseRateLargeAim: maxReleaseRateLargeAim,
      maxReleaseRateSmallAim: maxReleaseRateSmallAim,
      firstAbsRad: firstAbsRad,
      lastAbsRad: lastAbsRad,
      minReleaseSlideRad: minReleaseSlideRad,
      maxReleaseSlideRad: maxReleaseSlideRad
    };
  }

  // The TRACTION SEVERITY measurement (Step 14Q2, the SEVENTH seam
  // field). It mirrors the shape of measureCameraFollowOffset: the
  // samples are the DRIFT phases, the published severity is READ from
  // the seam, and the RATIO is published next to the counts so the run
  // carries the evidence the named check was decided on.
  //
  // THE RATIO IS published / oracle, where the oracle is the FIXTURE's
  // mirror of the shared law (see the DRIFT_FEEL_TRACTION_* constants).
  // The production publishes the severity from the POST-TRACTION speed
  // and the PUBLISHED slip - the very two numbers the seam publishes -
  // so the ratio is EXACTLY 1 for every sample of a correct build. The
  // check is therefore RATIO-shaped (D5 / R5) and never a floor: a seam
  // that carried a stale, zeroed, clamped or re-derived severity would
  // break it.
  function measureTractionSeverity(phases) {
    var samples = 0;
    var ratioSamples = 0;
    var ratioMismatches = 0;
    var outOfRange = 0;
    var zeroSeverityAtSlip = 0;
    var maxSeverity = 0;
    var maxAbsSlipRad = 0;
    var maxRatioDeviation = 0;
    for (var i = 0; i < feelSeamSamples.length; i++) {
      var s = feelSeamSamples[i];
      if (phases.indexOf(s.phase) === -1) continue;
      var severity = s.tractionSeverity;
      if (typeof severity !== 'number') continue;
      var slip = s.slipAngleRad;
      var speed = s.speedMps;
      if (typeof slip !== 'number' || typeof speed !== 'number') continue;
      samples += 1;
      var absSlip = Math.abs(slip);
      if (absSlip > maxAbsSlipRad) maxAbsSlipRad = absSlip;
      if (severity > maxSeverity) maxSeverity = severity;
      // The law's closed unit interval: the severity is a share, never
      // a percentage and never a negative.
      if (severity < 0 || severity > 1) outOfRange += 1;
      // Below the slip floor the severity is legitimately tiny, so the
      // ratio is not asserted there.
      if (absSlip < DRIFT_FEEL_TRACTION_SLIP_FLOOR_RAD) continue;
      // The severity must RESPOND to the slide: a published severity of
      // zero at a real slide means the tires show nothing (the D5 / R5
      // failure mode, and the reason the check is not a floor).
      if (severity <= 0) {
        zeroSeverityAtSlip += 1;
        continue;
      }
      // The ORACLE: the fixture's mirror of the shared law.
      var speedShare = speed > 0 ? speed / DRIFT_FEEL_TRACTION_TOP_SPEED_MPS : 0;
      var oracle = Math.min(
        1,
        Math.max(0, (absSlip / DRIFT_FEEL_TRACTION_SLIP_BUDGET_RAD) * speedShare)
      );
      if (oracle <= 0) continue;
      var ratio = severity / oracle;
      var deviation = Math.abs(ratio - 1);
      ratioSamples += 1;
      if (deviation > maxRatioDeviation) maxRatioDeviation = deviation;
      if (deviation > DRIFT_FEEL_TRACTION_RATIO_TOLERANCE) ratioMismatches += 1;
    }
    return {
      samples: samples,
      ratioSamples: ratioSamples,
      ratioMismatches: ratioMismatches,
      outOfRange: outOfRange,
      zeroSeverityAtSlip: zeroSeverityAtSlip,
      maxSeverity: maxSeverity,
      maxAbsSlipRad: maxAbsSlipRad,
      maxRatioDeviation: maxRatioDeviation
    };
  }

  // Step 14R: the HUD TRACTION READOUT measurement. The RENDERED readout
  // (the overlay's 'Traction NN%' text) is compared against the
  // PUBLISHED severity on the seam. The two numbers are READ, never
  // derived: the overlay renders the severity the physics step
  // published, and the seam publishes the same number, so a correct
  // build shows the same value (up to the display quantization of the
  // whole percent).
  //
  // THE CHECK IS AN EQUALITY BAND, NOT A FLOOR: the rendered percent has
  // to be within HALF a point of the published share, so a stale, zeroed,
  // clamped or re-derived readout FAILS. A floor ('the readout is above
  // zero') would have passed every one of them - which is exactly the
  // D5 / R5 failure mode ("the fixture reports GREEN while the tires show
  // nothing").
  //
  // IT IS NON-VACUOUS: the measurement also counts a PARSE FAILURE (the
  // readout text was missing or unreadable) as a failure, asserts that
  // at least one sample carried a NON-ZERO published severity, and
  // asserts that the readout showed a NON-ZERO percent at some point, so
  // a run where the overlay never showed the traction can never pass.
  //
  // THE RATIO (the rendered percent over the published percent) is
  // published as the EVIDENCE of the equality, and it is 1 for every
  // sample of a correct build. The ASSERTION is the absolute band, not
  // the ratio, because the readout is a ROUNDED percent: a share of
  // 0.004 renders as 0% (a ratio of 0), which is the display
  // quantization and not a defect. The band absorbs exactly that
  // quantization and nothing else.
  function measureHudTractionReadout(phases) {
    var samples = 0;
    var ratioSamples = 0;
    var mismatches = 0;
    var parseFailures = 0;
    var zeroSeveritySamples = 0;
    var maxSeverity = 0;
    var maxHudPercent = 0;
    var maxAbsDeviationPercent = 0;
    var maxRatioDeviation = 0;
    var lastReadoutText = null;
    for (var i = 0; i < feelSeamSamples.length; i++) {
      var s = feelSeamSamples[i];
      if (phases.indexOf(s.phase) === -1) continue;
      var severity = s.tractionSeverity;
      if (typeof severity !== 'number') continue;
      var text = typeof s.hudTractionText === 'string' ? s.hudTractionText : null;
      if (text !== null) lastReadoutText = text;
      var percent = parseHudTractionPercent(text);
      if (percent === null) {
        // The readout was not readable in this frame: the run must not
        // pass on a missing readout.
        parseFailures += 1;
        continue;
      }
      samples += 1;
      if (severity > maxSeverity) maxSeverity = severity;
      if (percent > maxHudPercent) maxHudPercent = percent;
      var seamPercent = severity * 100;
      var deviation = Math.abs(percent - seamPercent);
      if (deviation > maxAbsDeviationPercent) maxAbsDeviationPercent = deviation;
      if (seamPercent > 0) {
        ratioSamples += 1;
        var ratio = percent / seamPercent;
        var ratioDeviation = Math.abs(ratio - 1);
        if (ratioDeviation > maxRatioDeviation) maxRatioDeviation = ratioDeviation;
      } else {
        zeroSeveritySamples += 1;
      }
      if (deviation > DRIFT_FEEL_HUD_TRACTION_QUANTIZATION_BAND_PERCENT) {
        mismatches += 1;
      }
    }
    return {
      samples: samples,
      ratioSamples: ratioSamples,
      mismatches: mismatches,
      parseFailures: parseFailures,
      zeroSeveritySamples: zeroSeveritySamples,
      maxSeverity: maxSeverity,
      maxHudPercent: maxHudPercent,
      maxAbsDeviationPercent: maxAbsDeviationPercent,
      maxRatioDeviation: maxRatioDeviation,
      lastReadoutText: lastReadoutText
    };
  }

  function pickWheelBufferId() {
    var bestId = null;
    var bestCount = 0;
    wheelBufferIdsSeen.forEach(function (count, id) {
      if (count > bestCount) {
        bestCount = count;
        bestId = id;
      }
    });
    return bestId;
  }

  // The lit-draw stream is shared by the track lit program, the right-world
  // prop program and the car lit program, so a positional index no longer
  // identifies the car wheel draw. The car lit program is the only lit
  // program that declares uApplyTireGradient, and that uniform is 0 for the
  // body mesh and 1 for the wheel meshes, so the first car lit draw with
  // the gradient enabled IS the wheel draw.
  function pickWheelBufferIdThisFrame() {
    for (var i = 0; i < litDrawBufferIdsThisFrame.length; i++) {
      if (litDrawIsCarLitThisFrame[i] && litApplyThisFrame[i] > 0.5) {
        return litDrawBufferIdsThisFrame[i];
      }
    }
    return null;
  }

  // The per-frame capture arrays are parallel (buffer id, tire-gradient
  // value, car-lit flag), so they are cleared together.
  function resetFrameCapture() {
    carLitModelsThisFrame.length = 0;
    litDrawBufferIdsThisFrame.length = 0;
    litApplyThisFrame.length = 0;
    litDrawIsCarLitThisFrame.length = 0;
  }

  function analyzeWheelShading() {
    var id = pickWheelBufferId();
    if (!id) return { ok: false, error: 'no wheel buffer id captured' };
    var data = bufferDataMap.get(id);
    if (!data) return { ok: false, error: 'wheel buffer data missing' };
    if (data.length % 9 !== 0) return { ok: false, error: 'unexpected wheel buffer stride' };
    var n = data.length / 9;
    var upperSum = 0, upperCount = 0, lowerSum = 0, lowerCount = 0;
    for (var i = 0; i < n; i++) {
      var y = data[i * 9 + 1];
      var r = data[i * 9 + 3];
      var g = data[i * 9 + 4];
      var b = data[i * 9 + 5];
      var brightness = Math.max(r, g, b);
      if (y > 0) { upperSum += brightness; upperCount++; }
      else if (y < 0) { lowerSum += brightness; lowerCount++; }

    if (upperCount === 0 || lowerCount === 0) return { ok: false, error: 'missing upper/lower vertices' };
    var upperAvg = upperSum / upperCount;
    var lowerAvg = lowerSum / lowerCount;

    // The car lit program is the ONLY lit program that declares
    // uApplyTireGradient (the track lit program and the right-world prop
    // program do not), so it identifies the car shader source unambiguously.
    var litSrc = '';
    programSources.forEach(function (src) {
      if (src.indexOf('shadeLitSurface') !== -1 && src.indexOf('uApplyTireGradient') !== -1) {
        litSrc = src;
      }
    });
    var fixedSpaceShader = litSrc.indexOf('uApplyTireGradient') !== -1 &&
      litSrc.indexOf('uTireGradientRadius') !== -1 &&
      litSrc.indexOf('uModel[3][1]') !== -1 &&
      litSrc.indexOf('uSunDirection') !== -1;

    // The shader uses the shared uSunDirection so the highlight follows a
    // fixed top-front light direction while the wheel spins through it.
    // Only the CAR lit draws carry the tire-gradient contract: the track lit
    // program and the right-world prop program never feed
    // uApplyTireGradient, so their draws are excluded from the sequence.
    // Each car contributes one group of five draws - the body mesh without
    // the gradient (0) followed by the four wheel meshes with it (1).
    var seq = carLitApplySequence;
    var groups = [];
    var currentGroup = null;
    for (var gi = 0; gi < seq.length; gi++) {
      if (seq[gi] <= 0.5 || currentGroup === null) {
        currentGroup = [seq[gi]];
        groups.push(currentGroup);
      } else {
        currentGroup.push(seq[gi]);
      }
    }
    // A trailing group may be truncated when the sampling stopped between
    // the body draw and the last wheel draw, so it is ignored.
    if (groups.length > 0 && groups[groups.length - 1].length < 5) groups.pop();
    var patternOk = groups.length > 0 && groups.every(function (group) {
      return group.length === 5 &&
        group[0] === 0 && group[1] === 1 && group[2] === 1 && group[3] === 1 && group[4] === 1;
    });

    return {
      ok: true,
      upperAvg: upperAvg,
      lowerAvg: lowerAvg,
      gradient: upperAvg - lowerAvg,
      fixedSpaceShader: fixedSpaceShader,
      tireGradientPatternOk: patternOk,
      tireGradientApplySequence: seq.slice(0, 16)
    };
  }

  function getShadowMaxAlpha() {
    var shadowSrc = '';
    programSources.forEach(function (src) {
      if (src.indexOf('uShadowColor') !== -1) shadowSrc = src;
    });

  async function runChecks() {

      result.modeSwitchedToManual = setManualMode();

      // FIVE label divs to its wrapper in a fixed order - speed, lap,

      // EXPLICIT about the depth (the container's direct child is the

      // own shape ('Traction 42%'), so a wrong element would fail the

      hudTractionLabel = hudContainer

      dispatchKey('KeyA', true);
      var obsA = await observeFrames(12, function (frameIndex) {

            // body, so at rest (no drift) its relative yaw and its offset
            // heading are the constants the drift phase must preserve.
            relativeYawA.push(
              wrapAngle(yawFromMatrixColumn3(models[3]) - yawFromMatrixColumn3(models[0]))
            );
            relativeOffsetA.push(
              wrapAngle(
                offsetAngle(models[3][12] - models[0][12], models[3][14] - models[0][14]) -
                yawFromMatrixColumn3(models[0])
              )
            );
          }
        }
        var candidate = pickWheelBufferIdThisFrame();
        if (candidate) {
          wheelBufferIdsSeen.set(candidate, (wheelBufferIdsSeen.get(candidate) || 0) + 1);
        }
        resetFrameCapture();
      });
      dispatchKey('KeyA', false);
      await sleep(150);
      dispatchKey('KeyD', true);
      var obsD = await observeFrames(12, function (frameIndex) {

      // scenario accelerates on the road (throttle only) until the HUD speed
      // passes the drift gate before the W+A phase starts. Without this phase
      // the W+A phase never reaches the drift speed and the tire-yaw contract

      dispatchKey('KeyW', true);

        if (accelSpeed > maxSpeedKmhAccel) maxSpeedKmhAccel = accelSpeed;
        var candidate = pickWheelBufferIdThisFrame();
        if (candidate) {

      });
      dispatchKey('KeyA', true);

          if (frameIndex === 92) endBody = pos;

          // than it points, so the proxy proves the drift engaged (reaching

          //

            var chordDz = newestSample.z - oldestSample.z;

            wrapAngle(

            )
          );
        }
        // Peak speed over the drift phase: the arcade drift only engages

        var candidate = pickWheelBufferIdThisFrame();
        if (candidate) {
          wheelBufferIdsSeen.set(candidate, (wheelBufferIdsSeen.get(candidate) || 0) + 1);

      });
      dispatchKey('KeyW', false);
      dispatchKey('KeyA', false);
      await sleep(200);

      var vboInfo = analyzeTrackVbo();
      var wheelShading = analyzeWheelShading();
      var avgA = average(steerSamplesA);
      var avgD = average(steerSamplesD);
      // AC-078: the attached tires must follow the body drift angle, so the

      var maxRelativeOffsetError = 0;

          wrapAngle(relativeOffsetWA[relOffsetIndex] - baselineRelativeOffset)

        relativeYawWA.length > 0 &&

        maxDriftProxyRad >= DRIFT_PROXY_MIN_RAD &&
        driftProxyRunMaxFrames >= DRIFT_PROXY_MIN_FRAMES;
      var yawChange = (startBody && endBody) ? wrapAngle(endBody.yaw - startBody.yaw) : 0;
      var distMoved = (startBody && endBody) ? Math.hypot(endBody.x - startBody.x, endBody.z - startBody.z) : 0;
      var finalSpeed = readSpeed(speedLabel);

      var singleGridA = obsA.gridDelta >= 10 && obsA.gridDelta <= 13;
      var singleGridD = obsD.gridDelta >= 10 && obsD.gridDelta <= 13;
      var singleGridWA = obsWA.gridDelta >= 95 && obsWA.gridDelta <= 103;
      var singleTrackA = obsA.trackDelta >= 10 && obsA.trackDelta <= 13;
      var singleTrackD = obsD.trackDelta >= 10 && obsD.trackDelta <= 13;
      var singleTrackWA = obsWA.trackDelta >= 95 && obsWA.trackDelta <= 103;

      // retained W+A phase and BEFORE the checks object, and it runs on its

      // inputs it had before (the retained analysis above was already
      // taken before this block runs).
      //
      // A failure inside the new phases must NOT abort the fixture: the
      // catch-all would replace the whole notes payload and hide every
      // other check. So the block is guarded, its failures land in

      var feelErrors = [];
      var feelCatchStartMs = 0;
      var feelMirrorCatchStartMs = 0;
      try {

        // the mode is already manual, so P0 RE-AFFIRMS the existing code

        var p0State = resetFeelPhase('P0');

        p0State.bundleReused = !!(result.bundleLoaded && result.neatRacingStartDefined);

        // and the release is the COUNTERSTEER unwind. The 7b observable is
        // therefore SPLIT into 7b-HOLD (the slide is still there while the
        // steer is neutral) and 7b-RELEASE (the countersteer unwinds it and

        // measured AFTER the release - never before it, because the pose
        // spring has NO snap: its target is the committed slip, so a pose
        // that was never loaded cannot prove that the slide was released.
        //
        // The two NAMED capture points (the AC-079 pair) are measured in
        // TWO CONTROLLED RUNS that each start from the SAME fresh spawn
        // state and each run the SAME tick budget, so the two capture
        // points are comparable by construction (the same elapsed ticks

        // follows on its own fresh spawn state: it is not a capture pair,
        // it only carries the OTHER steer sign.
        //
        // RIBBON RE-ENTRY (the "keep the car on the ribbon" clause of the

        // OFF-ROAD: the retained W+A slide leaves the ribbon, and an
        // off-road car can never produce the ON-ROAD straight capture the
        // D1.3 capture pair needs (off-road, the speed settles at the

        // a fresh car: a mode switch re-seeds the car state at the spawn
        // pose (the first segment's centreline, ON the ribbon) and clears
        // the drift model. The fixture switches to 'ai' and straight back
        // to 'manual' inside ONE task, so the autopilot never drives a
        // frame and the final state is a fresh car on the ribbon in manual
        // mode. The re-entry is an ACTION, not a phase: it consumes no
        // ticks, so the capture runs stay tick-comparable.
        //

        // and drives STRAIGHT (the throttle only, the speed UNCAPPED so
        // the capture is read at the free-acceleration speed) for the
        // whole capture budget. The NAMED 'straight' capture point is the
        // end of this run.
        p0State.ribbonReentry = reentryCarOnRibbon();

        // arms the countersteer, so the order is recorded and the catch

        countersteerReleasedBeforePress =
          countersteerKeyOrder[0] === 'KeyA:up' && countersteerKeyOrder[1] === 'KeyD:down';
        feelCatchStartMs = nowMs();
        await observeFeelPhase('P2-RELEASE', RELEASE_TICKS, speedLabel, null, {
          speedCapKmh: FEEL_STRAIGHT_MAX_SPEED_KMH
        });

        // P2-SETTLE: the ring-down. The pose spring decays asymptotically
        // towards its hard zero (the production simulation measures
        // 1.835e-8 rad after a 120-tick settle), so the window is the
        // 40 ticks the ring-down needs: the simulation measures 0.00304
        // rad over the last 30 ticks of the settle (the far-side pop's
        // residual ringing) and 0.000076 rad over the straight phase
        // that follows. The countersteer is released here, so the steer
        // is neutral again (and the model re-arms on the neutral tick).
        await dispatchKeyAligned('P2-SETTLE', 'KeyD', false);
        await observeFeelPhase('P2-SETTLE', SETTLE_TICKS, speedLabel, null, {

        });

        // drops below the drift gate, the drift disengages and the pose
        // snaps to 0 - the vacuous pass the re-based expectation forbids).
        await observeFeelPhase('P2-STRAIGHT', FEEL_STRAIGHT_TICKS, speedLabel, null, {

        });

        // not a capture pair, so it does not have to match the P2 tick

        // on the ribbon.

        await observeFeelPhase('P3-MIRROR-COMMIT', MIRROR_COMMIT_TICKS, speedLabel, null);

        feelMirrorCatchStartMs = nowMs();

          speedCapKmh: FEEL_STRAIGHT_MAX_SPEED_KMH
        });
        await observeFeelPhase('P3-MIRROR-SETTLE', SETTLE_TICKS, speedLabel, null, {

        });

        // again, so the pose has to be back at the hard zero again. The
        // throttle STAYS DOWN on purpose: a coasting car drops below the
        // drift gate, the drift disengages and the pose snaps to 0 for the
        // WRONG reason, which would make the check pass VACUOUSLY. A
        // driven straight line keeps the slide alive, so the pose has to
        // return to 0 on its own.
        await observeFeelPhase('P4-RECHECK', RECHECK_TICKS, speedLabel, null, {

      }

      // of them degrades to a FALSE check when the measurement is missing
      // (no seam, no capture, an unexpected frame count) - never to an
      // optimistic true.
      //
      // The MOVE phases are the phases of the re-based manoeuvre. The
      // re-based sequence (14N W3, the D5 re-base) is:
      //   P1-STRAIGHT   the straight capture run - the NAMED 'straight'
      //                  capture point (on the ribbon);
      //   P2-ACCEL      the throttle down before the steer;
      //   P2-COMMIT     the fixture's OWN commit (the left steer in);
      //   P2-HOLD       the NEUTRAL steer - the 7b-HOLD evidence and the

      //   P2-RELEASE    the countersteer - the 7b-RELEASE evidence and
      //                  the far-side pop;
      //   P2-SETTLE     the ring-down towards the hard zero;
      //   P2-STRAIGHT   the straight line AFTER the release - the re-based
      //                  7b straight-line observable;
      //   P3-ACCEL       the mirror run's accel (its own fresh spawn);
      //   P3-MIRROR-*   the mirrored manoeuvre (the OTHER sign);
      //   P4-RECHECK    the straight-line re-check.
      var FEEL_MOVE_PHASES = [

        'P2-SETTLE', 'P2-STRAIGHT', 'P3-ACCEL', 'P3-MIRROR-COMMIT',
        'P3-MIRROR-HOLD', 'P3-MIRROR-CATCH', 'P3-MIRROR-SETTLE', 'P4-RECHECK'

      // to be back at the hard zero in BOTH of them.

      var movePose = maxAbsPoseForPhases(FEEL_MOVE_PHASES);
      var moveSlip = maxAbsSlipForPhases(FEEL_MOVE_PHASES);

          // whether the capture runs therefore share the same fresh
          // spawn state).
          ribbonReentry: {
            first: p0State.ribbonReentry === true,
            second: p0State.ribbonReentry2 === true,
            third: p0State.ribbonReentry3 === true
          },
          // The 7b-HOLD and 7b-RELEASE evidence of the re-based 7b
          // observable (the D5 re-base).
          holdEvidence: {
            slipMaxRad: holdSlip.maxRad,
            slipSamples: holdSlip.count,
            poseMaxRad: holdPose.maxRad,
            poseSamples: holdPose.count,
            slipFloorRad: DRIFT_FEEL_HOLD_MIN_SLIP_RAD,
            poseFloorRad: DRIFT_FEEL_HOLD_MIN_POSE_RAD
          },
          releaseEvidence: {
            slipTailMaxRad: releaseSlipTail.maxRad,
            slipTailSamples: releaseSlipTail.count,
            slipTailUnit: releaseSlipTail.unit,
            poseTailMaxRad: releasePoseTail.maxRad,
            poseTailSamples: releasePoseTail.count,
            snapBandRad: DRIFT_FEEL_RELEASE_SLIP_MAX_RAD
          },
          // The regime-aware PUBLISHED-SLIP mirrors and the per-regime
          // headroom, so a road-regime excursion is visible in the
          // evidence even though the assertion uses the widest declared
          // bound.
          publishedSlipMirrors: {
            onRoadMaxRad: DRIFT_FEEL_PUBLISHED_SLIP_MAX_RAD,
            offRoadMaxRad: DRIFT_FEEL_PUBLISHED_SLIP_OFFROAD_MAX_RAD,
            envelopeRad: DRIFT_FEEL_PUBLISHED_SLIP_ENVELOPE_RAD,
            measuredMaxRad: moveSlip.maxRad,
            // The REGIME-AWARE bound: the phase that carried the peak
            // decides the mirror (the on-road mirror when the peak's
            // phase was on the rendered ribbon, the off-road mirror when
            // it was not, and the widest declared bound when the regime
            // could not be measured).
            assertedBoundRad: publishedSlipBoundRad,
            peakPhase: publishedSlipPeak ? publishedSlipPeak.phase : null,
            peakOnRoad: publishedSlipPeak ? publishedSlipPeak.onRoad : null,
            peakRoadDistanceM: publishedSlipPeak ? publishedSlipPeak.roadDistanceM : null,
            perPhase: publishedSlipPhases,
            onRoadHeadroomRad: DRIFT_FEEL_PUBLISHED_SLIP_MAX_RAD - moveSlip.maxRad,
            offRoadHeadroomRad: DRIFT_FEEL_PUBLISHED_SLIP_OFFROAD_MAX_RAD - moveSlip.maxRad,
            aboveOnRoadCeiling: moveSlip.maxRad > DRIFT_FEEL_PUBLISHED_SLIP_MAX_RAD
          },
          tireGradient: {
            applyEnabled: tireGradientApplyEnabled,
            brightFactor: tireGradientBrightFactor,
            darkFactor: tireGradientDarkFactor,
            radius: tireGradientRadius,
            threshold: tireGradientThreshold
          },
          speedTrace: feelSpeedTrace,
          phases: feelPhases
        }
      });
    } catch (err) {
      result.consoleErrors.push(String(err));
      result.notes = 'Fatal: ' + String(err);
    }
    window.p1TurnDriftGreenSmokeResult = result;
  }

  runChecks();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1 turn-drift-green smoke</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #05070d; overflow: hidden; }
#neatracing-output { width: 100%; height: 100%; }
#neatracing-hud-output { position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
<div id="neatracing-output"></div>
<div id="neatracing-hud-output"></div>
<script>
(function () {
  'use strict';
  var result = {
    passed: false,
    bundleLoaded: false,
    neatRacingStartDefined: false,
    canvasMounted: false,
    hudMounted: false,
    modeSwitchedToManual: false,
    webglOk: false,
    consoleErrors: [],
    networkFailures: [],
    checks: {},
    notes: ''
  };
  window.p1TurnDriftGreenSmokeResult = result;

  window.addEventListener('error', function (e) {
    result.consoleErrors.push('error: ' + String(e.message));
  });
  window.addEventListener('unhandledrejection', function (e) {
    result.consoleErrors.push('unhandledrejection: ' + String(e.reason));
  });
  var origConsoleError = console.error;
  console.error = function () {
    result.consoleErrors.push(Array.from(arguments).map(String).join(' '));
    return origConsoleError.apply(this, arguments);
  };

  var shaderSources = new Map();
  var programSources = new Map();
  var locationName = new Map();
  var currentProgram = null;
  var currentArrayBuffer = null;
  var gridDraws = 0;
  var trackDraws = 0;
  var shadowDraws = 0;
  var capturedGridSpacing = null;
  var capturedTrackVboData = null;
  var carLitModelsThisFrame = [];
  var litDrawBufferIdsThisFrame = [];
  var wheelBufferIdsSeen = new Map();
  var gridProgram = null;
  var trackProgram = null;
  var bufferDataMap = new Map();
  var shadowColorFeeds = [];
  var shadowModelScales = [];
  var tireGradientApplySequence = [];
  var currentTireGradientApply = 0;
  var litApplyThisFrame = [];
  // Parallel to litDrawBufferIdsThisFrame: true when the lit draw came from
  // the CAR lit program. The car lit program is the only program that
  // declares uApplyTireGradient (the track lit program and the right-world
  // prop program do not), so this flag isolates the car draws inside the
  // shared lit-draw stream.
  var litDrawIsCarLitThisFrame = [];
  // The uApplyTireGradient values of the CAR lit draws only, in draw order.
  // The lit stream is shared by the track, the right-world props and the
  // car, so the tire-gradient contract must be read from the car draws
  // alone: per car and frame the pattern is [0, 1, 1, 1, 1] (body mesh
  // without the gradient, four wheel meshes with it).
  var carLitApplySequence = [];
  // AC-078 measurement state: the tire-to-body relative yaw and the
  // tire-to-body offset heading, sampled at rest (the baseline) and during
  // the high-speed drift phase. The tires are ATTACHED, so both must stay
  // constant while the body yaws into the slide.
  var relativeYawA = [];
  var relativeYawWA = [];
  var relativeOffsetA = [];
  var relativeOffsetWA = [];
  var maxSpeedKmhDrift = 0;
  var maxSpeedKmhAccel = 0;
  // AC-078: the peak drift-angle proxy (the body's rendered yaw versus the
  // direction of travel) plus the rolling body samples used to derive the
  // travel direction from a multi-sample chord.
  var maxDriftProxyRad = 0;
  var driftProxyFrameCount = 0;
  var driftProxyRunFrames = 0;
  var driftProxyRunMaxFrames = 0;
  var driftProxySamples = [];
  // AC-078 tolerance: the attached tire must keep the same relative pose to
  // the body while the body yaws into the slide. The float32 matrix noise is
  // ~1e-5 rad, so 0.002 rad is a tight but safe band (the drift yaw reaches
  // several hundredths of a radian).
  var TIRE_YAW_FOLLOW_TOLERANCE_RAD = 0.002;
  // AC-079: the tires must actually LOSE TRACTION proportionally during a
  // full-speed drift. The arcade top speed is 89 m/s (~320 km/h); the old
  // model held that whole top speed through any turn because the tires
  // never gave up any forward grip. A sustained hard turn that stays below
  // this ceiling proves the forward grip was spent on the slide.
  var TRACTION_LOSS_MAX_SPEED_KMH = 290;
  // The arcade drift only engages above 15 m/s (54 km/h), so the scenario
  // must reach that speed for the tire-yaw contract to be exercised at all.
  var DRIFT_MIN_SPEED_KMH = 54;
  // AC-078 scenario gate: the phase before the drift turn accelerates on the
  // road (throttle only) until the HUD speed passes this target, so the W+A
  // phase starts ABOVE the drift threshold instead of from a standstill.
  var ACCEL_TARGET_SPEED_KMH = 90;
  // Frame budget for the speed-gated acceleration phase. The gate is
  // speed-driven, so the budget only bounds a stalled or off-road run.
  var ACCEL_MAX_FRAMES = 600;
  // The track lit VBO is interleaved position(3) + color(3) + normalAxis(1)
  // = 7 floats per vertex (NEATRACING_TRACK_LIT_FLOATS_PER_VERTEX in
  // engine/passes/track.pass.ts). The fixture must read the same stride.
  var TRACK_LIT_FLOATS_PER_VERTEX = 7;
  // AC-078 drift proxy gate: the body's rendered yaw is compared with the
  // direction of travel. A sliding car travels at a different angle than it
  // points, so a proxy above this threshold proves the drift is engaged (the
  // speed gate alone does not prove a slide). The gate also requires a
  // CONSECUTIVE run of at least DRIFT_PROXY_MIN_FRAMES frames above the
  // threshold, so a single-frame transient cannot decide the phase.
  var DRIFT_PROXY_MIN_RAD = 0.01;
  // Minimum number of CONSECUTIVE drift-phase frames that must reach
  // DRIFT_PROXY_MIN_RAD for the drift engagement to count (a sustained
  // slide, not a spike).
  var DRIFT_PROXY_MIN_FRAMES = 3;
  // AC-078 drift proxy window: the travel direction is derived from a chord
  // across this many body samples and is compared against the MEAN OF THE
  // TWO ENDPOINT yaws of the same window. The chord of a circular arc is
  // parallel to the tangent at the arc's mid-angle, and the heading is
  // linear in time for a constant turn rate, so the endpoint mean IS the
  // heading at the chord's temporal mid-point: the mid-window sampling lag
  // cancels EXACTLY for any per-frame tick distribution (the host releases
  // 0-4 simulation ticks per rendered frame). The residual is bounded by the
  // yaw-acceleration term (alpha * T^2 / 8 over the window) plus the
  // speed-variation term, which is <= 0.002 rad at the observed drift speed
  // - 5x below the 0.01 rad DRIFT_PROXY_MIN_RAD gate. The scenario itself
  // (the fixed-frame drift phase) stays render-rate dependent - that is
  // pre-existing and out of this contract's scope.
  var DRIFT_PROXY_WINDOW = 6;

  function sourceOf(program) {
    return programSources.get(program) || '';
  }
  function recordUniform(loc, value) {
    if (!currentProgram) return;
    var name = locationName.get(loc);
    if (!name) return;
    if (name === 'uSpacing' && sourceOf(currentProgram).indexOf('uSpacing') !== -1) {
      capturedGridSpacing = value;
      gridProgram = currentProgram;
    }
  }

  function wrapGL(gl) {
    if (!gl || gl.__patched) return gl;
    gl.__patched = true;
    var proto = Object.getPrototypeOf(gl);
    function wrap(method, fn) {
      var orig = proto[method];
      proto[method] = function () {
        return fn.call(this, orig, arguments);
      };
    }
    wrap('shaderSource', function (orig, args) {
      shaderSources.set(args[0], args[1]);
      return orig.apply(this, args);
    });
    wrap('attachShader', function (orig, args) {
      var src = shaderSources.get(args[1]) || '';
      programSources.set(args[0], (programSources.get(args[0]) || '') + src);
      return orig.apply(this, args);
    });
    wrap('useProgram', function (orig, args) {
      currentProgram = args[0];
      return orig.apply(this, args);
    });
    wrap('getUniformLocation', function (orig, args) {
      var loc = orig.apply(this, args);
      if (loc) locationName.set(loc, args[1]);
      return loc;
    });
    wrap('uniform1f', function (orig, args) {
      recordUniform(args[0], args[1]);
      var name = locationName.get(args[0]);
      if (name === 'uApplyTireGradient' && sourceOf(currentProgram).indexOf('shadeLitSurface') !== -1) {
        currentTireGradientApply = args[1];
        tireGradientApplySequence.push(args[1]);
      }
      return orig.apply(this, args);
    });
    wrap('uniform3f', function (orig, args) {
      var name = locationName.get(args[0]);
      if (name === 'uShadowColor') {
        shadowColorFeeds.push([args[1], args[2], args[3]]);
      }
      return orig.apply(this, args);
    });
    wrap('uniformMatrix4fv', function (orig, args) {
      var loc = args[0], data = args[2];
      recordUniform(loc, data);
      var src = sourceOf(currentProgram);
      var name = locationName.get(loc);
      if (src.indexOf('shadeLitSurface') !== -1 && name === 'uModel') {
        var arr = new Float32Array(data.length);
        arr.set(data);
        carLitModelsThisFrame.push(arr);
      }
      if (src.indexOf('uShadowColor') !== -1 && name === 'uModel') {
        shadowModelScales.push(data[0]);
      }
      return orig.apply(this, args);
    });
    wrap('bindBuffer', function (orig, args) {
      if (args[0] === this.ARRAY_BUFFER) currentArrayBuffer = args[1];
      return orig.apply(this, args);
    });
    wrap('bufferData', function (orig, args) {
      var target = args[0], data = args[1];
      if (target === this.ARRAY_BUFFER && data instanceof Float32Array && currentArrayBuffer) {
        bufferDataMap.set(currentArrayBuffer, data.slice());
      }
      return orig.apply(this, args);
    });
    wrap('drawArrays', function (orig, args) {
      var src = sourceOf(currentProgram);
      if (src.indexOf('uSpacing') !== -1) {
        gridDraws++;
        gridProgram = currentProgram;
      }
      // The track lit program is identified by its vertex-shader marker
      // `vAlbedo = aColor;` TOGETHER with the absence of the car-only
      // uniforms: the car lit program emits the same `vAlbedo = aColor;`
      // marker, so the marker alone would also match the car.
      var isTrackLitProgram =
        src.indexOf('vAlbedo = aColor;') !== -1 &&
        src.indexOf('uApplyTireGradient') === -1 &&
        src.indexOf('uModel') === -1;
      if (isTrackLitProgram) {
        trackDraws++;
        trackProgram = currentProgram;
        if (!capturedTrackVboData) {
          var buf = this.getParameter(this.ARRAY_BUFFER_BINDING);
          var d = bufferDataMap.get(buf);
          if (d && d.length > 100) capturedTrackVboData = d.slice();
        }
      }
      if (src.indexOf('uShadowColor') !== -1) {
        shadowDraws++;
      }
      if (src.indexOf('shadeLitSurface') !== -1) {
        litDrawBufferIdsThisFrame.push(currentArrayBuffer);
        litApplyThisFrame.push(currentTireGradientApply);
        var isCarLit = src.indexOf('uApplyTireGradient') !== -1;
        litDrawIsCarLitThisFrame.push(isCarLit);
        if (isCarLit) carLitApplySequence.push(currentTireGradientApply);
      }
      return orig.apply(this, args);
    });
  }

  var origGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = origGetContext.call(this, type, attrs);
    if (type === 'webgl2' || type === 'experimental-webgl2') wrapGL(ctx);
    return ctx;
  };

  function loadBundle() {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = '../../assets/neatracing.bundle.js';
      s.onload = function () { result.bundleLoaded = true; resolve(); };
      s.onerror = function () {
        result.networkFailures.push('bundle load error');
        reject(new Error('bundle load error'));
      };
      document.body.appendChild(s);
    });
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function dispatchKey(code, down) {
    window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
      code: code, bubbles: true, cancelable: true, composed: true
    }));
  }
  function yawFromMatrix(m) {
    return Math.atan2(-m[2], m[0]);
  }
  // Yaw around world up read from a model matrix's third column (the
  // model's local +Z axis). The wheel chain ends with a spin rotation about
  // the model depth axis, which leaves that column untouched, so this reads
  // the tire's mount yaw without the wheel spin polluting it.
  function yawFromMatrixColumn3(m) {
    return Math.atan2(m[8], m[10]);
  }
  // Heading of a world-space XZ offset vector, in the same convention as
  // yawFromMatrixColumn3 (atan2(x, z)).
  function offsetAngle(dx, dz) {
    return Math.atan2(dx, dz);
  }
  function wrapAngle(a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  }
  function average(arr) {
    if (!arr.length) return 0;
    return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
  }

  function setManualMode() {
    var select = document.getElementById('neatracing-race-mode-selector');
    if (!select) return false;
    select.value = 'manual';
    select.dispatchEvent(new Event('change', { bubbles: true }));
    return true;
  }

  function analyzeTrackVbo() {
    var data = capturedTrackVboData;
    if (!data) return { ok: false, error: 'no track VBO captured' };
    if (data.length % TRACK_LIT_FLOATS_PER_VERTEX !== 0) {
      return { ok: false, error: 'unexpected track VBO stride' };
    }
    var n = data.length / TRACK_LIT_FLOATS_PER_VERTEX;
    var minY = Infinity, maxY = -Infinity, edgeMaxY = -Infinity;
    var paintMinY = Infinity;
    var red = 0, yellow = 0, green = 0, teal = 0, neonCount = 0;
    var matteCount = 0, fillCount = 0, edgeCount = 0;
    var topOldColors = 0, topLayerCount = 0;
    var roadPoints = [];
    var redPoints = [], yellowPoints = [], greenPoints = [];
    var blackOutlineCount = 0;
    var PAINT_Y_THRESHOLD = 0.015;
    var NEAR_BLACK_THRESHOLD = 0.12;
    var TOP_Y_THRESHOLD = 0.005;
    var BAND_EDGE_WIDTH_M = 0.5;
    var OLD_ROAD = [64 / 255, 64 / 255, 68 / 255];
    var OLD_CURB = [214 / 255, 44 / 255, 44 / 255];
    var OLD_GRASS = [46 / 255, 156 / 255, 70 / 255];
    function isOldColor(r, g, b) {
      return (
        (Math.abs(r - OLD_ROAD[0]) < 0.05 && Math.abs(g - OLD_ROAD[1]) < 0.05 && Math.abs(b - OLD_ROAD[2]) < 0.05) ||
        (Math.abs(r - OLD_CURB[0]) < 0.05 && Math.abs(g - OLD_CURB[1]) < 0.05 && Math.abs(b - OLD_CURB[2]) < 0.05) ||
        (Math.abs(r - OLD_GRASS[0]) < 0.05 && Math.abs(g - OLD_GRASS[1]) < 0.05 && Math.abs(b - OLD_GRASS[2]) < 0.05)
      );
    }
    function avg(arr) {
      if (!arr.length) return 0;
      var s = 0;
      for (var k = 0; k < arr.length; k++) s += arr[k];
      return s / arr.length;
    }
    // The road vertex set holds hundreds of thousands of vertices, so the
    // exhaustive nearest-vertex scan this measurement used to run cost
    // minutes of main-thread time per border color and blocked the renderer
    // before the scenario could finish. A uniform grid over the same
    // vertices answers the exact same question in linear time: the search
    // expands ring by ring and stops as soon as the closest hit is provably
    // closer than every cell that has not been visited yet, so the reported
    // distance is still the true nearest road vertex distance.
    var ROAD_GRID_CELL_M = 4;
    var ROAD_GRID_MAX_RING = 64;
    var roadGrid = new Map();
    function roadGridKey(x, z) {
      return Math.floor(x / ROAD_GRID_CELL_M) + ',' + Math.floor(z / ROAD_GRID_CELL_M);
    }
    function buildRoadGrid() {
      roadGrid = new Map();
      for (var k = 0; k < roadPoints.length; k++) {
        var key = roadGridKey(roadPoints[k][0], roadPoints[k][1]);
        var bucket = roadGrid.get(key);
        if (!bucket) {
          bucket = [];
          roadGrid.set(key, bucket);
        }
        bucket.push(roadPoints[k][0], roadPoints[k][1]);
      }
    }
    function exhaustiveNearestRoadDistance(x, z) {
      var best = Infinity;
      for (var k = 0; k < roadPoints.length; k++) {
        var dx = x - roadPoints[k][0];
        var dz = z - roadPoints[k][1];
        var d2 = dx * dx + dz * dz;
        if (d2 < best) best = d2;
      }
      return Math.sqrt(best);
    }
    function nearestRoadDistance(x, z) {
      if (!roadPoints.length) return Infinity;
      var cx = Math.floor(x / ROAD_GRID_CELL_M);
      var cz = Math.floor(z / ROAD_GRID_CELL_M);
      var best = Infinity;
      for (var ring = 0; ring <= ROAD_GRID_MAX_RING; ring++) {
        for (var dx = -ring; dx <= ring; dx++) {
          for (var dz = -ring; dz <= ring; dz++) {
            if (ring > 0 && Math.abs(dx) !== ring && Math.abs(dz) !== ring) continue;
            var bucket = roadGrid.get((cx + dx) + ',' + (cz + dz));
            if (!bucket) continue;
            for (var q = 0; q < bucket.length; q += 2) {
              var ddx = x - bucket[q];
              var ddz = z - bucket[q + 1];
              var d2 = ddx * ddx + ddz * ddz;
              if (d2 < best) best = d2;
            }
          }
        }
        // Every cell that has not been visited yet is at least `ring` cells
        // away, so a hit closer than that cannot be beaten any more.
        if (ring > 0 && best <= (ring - 1) * ROAD_GRID_CELL_M) return Math.sqrt(best);
      }
      // Fall back to the exhaustive scan so the measurement stays exact even
      // for border vertices that sit far outside the gridded road.
      return exhaustiveNearestRoadDistance(x, z);
    }
    for (var i = 0; i < n; i++) {
      var base = i * TRACK_LIT_FLOATS_PER_VERTEX;
      var x = data[base], y = data[base + 1], z = data[base + 2];
      var r = data[base + 3], g = data[base + 4], b = data[base + 5];
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      var mx = Math.max(r, g, b);
      // Paint-colored vertices (non-matte) reveal the single-plane paint y.
      // The ground slab sits at y = -0.5 and is not part of the paint layer,
      // so only vertices at or above the paint plane are counted.
      if (mx > 0.15 && y >= PAINT_Y_THRESHOLD) {
        paintMinY = Math.min(paintMinY, y);
      }
      if (y >= PAINT_Y_THRESHOLD && mx <= NEAR_BLACK_THRESHOLD) {
        blackOutlineCount++;
      }
      if (y >= TOP_Y_THRESHOLD) {
        topLayerCount++;
        if (isOldColor(r, g, b)) topOldColors++;
      }
      if (mx <= 0.15) {
        matteCount++;
      } else if (b > 0.8 && r < 0.25) {
        edgeCount++;
        teal++;
        roadPoints.push([x, z]);
      } else if (g > 0.3 && b > 0.3 && r < 0.15) {
        fillCount++;
        teal++;
        roadPoints.push([x, z]);
      } else if ((r > 0.5 && g < 0.25 && b < 0.25) || (r > 0.8 && g < 0.35 && b < 0.35)) {
        red++;
        redPoints.push({ x: x, z: z });
      } else if ((r > 0.5 && g > 0.5 && b < 0.25) || (r > 0.8 && g > 0.8 && b < 0.35)) {
        yellow++;
        yellowPoints.push({ x: x, z: z });
      } else if ((g > 0.5 && r < 0.25 && b < 0.25) || (g > 0.8 && r < 0.35 && b < 0.35)) {
        green++;
        greenPoints.push({ x: x, z: z });
      }
      if (mx > 0.9) {
        neonCount++;
        edgeMaxY = Math.max(edgeMaxY, y);
      }
    }
    buildRoadGrid();
    var greenEdgeDists = [];
    for (var gi = 0; gi < greenPoints.length; gi++) {
      greenEdgeDists.push(nearestRoadDistance(greenPoints[gi].x, greenPoints[gi].z));
    }
    var yellowEdgeDists = [];
    for (var yi = 0; yi < yellowPoints.length; yi++) {
      yellowEdgeDists.push(nearestRoadDistance(yellowPoints[yi].x, yellowPoints[yi].z));
    }
    var redEdgeDists = [];
    for (var ri = 0; ri < redPoints.length; ri++) {
      redEdgeDists.push(nearestRoadDistance(redPoints[ri].x, redPoints[ri].z));
    }
    var greenMeanEdge = avg(greenEdgeDists);
    var yellowMeanEdge = avg(yellowEdgeDists);
    var redMeanEdge = avg(redEdgeDists);
    return {
      minY: minY, maxY: maxY, neonCount: neonCount, edgeMaxY: edgeMaxY,
      paintMinY: paintMinY,
      red: red, yellow: yellow, green: green, teal: teal,
      matteCount: matteCount, fillCount: fillCount, edgeCount: edgeCount,
      topOldColors: topOldColors, topLayerCount: topLayerCount,
      greenMeanEdge: greenMeanEdge, yellowMeanEdge: yellowMeanEdge, redMeanEdge: redMeanEdge,
      noVerticalPillars: edgeMaxY < 0.1,
      flatPaint: edgeMaxY < 0.05 && Math.abs(edgeMaxY - (minY > 0 ? minY : edgeMaxY)) < 0.05,
      // Single-plane paint (OBS-23): all neon stroke and fill vertices share
      // the same small positive y. The old layered stroke-above-fill design
      // is no longer asserted.
      singlePlanePaint: edgeMaxY >= PAINT_Y_THRESHOLD && Math.abs(edgeMaxY - paintMinY) < 1e-4,
      borderBandsPresent: red > 0 && yellow > 0 && green > 0,
      noOldRoadCurbColors: topOldColors === 0,
      topFacesMatteBlack: matteCount > 0 && topOldColors === 0,
      honeycombContinuous: fillCount > 1000 && edgeCount > 1000 && edgeCount < 1.5 * fillCount,
      noDoubleBorders: edgeCount > 0 && edgeCount < 1.5 * fillCount,
      blackOutlineCount: blackOutlineCount,
      noBlackOutline: blackOutlineCount === 0,
      // Walking outward from the track edge: green innermost, yellow middle,
      // red outermost (OBS-12). Distances are measured to the nearest road
      // vertex so the assertion works even when the track is not centered on
      // the world origin.
      borderBandsAt6m: greenEdgeDists.length > 0 && yellowEdgeDists.length > 0 && redEdgeDists.length > 0 &&
        greenMeanEdge < yellowMeanEdge - BAND_EDGE_WIDTH_M &&
        yellowMeanEdge < redMeanEdge - BAND_EDGE_WIDTH_M
    };
  }

  function observeFrames(count, cb) {
    return new Promise(function (resolve) {
      var startGrid = gridDraws, startTrack = trackDraws;
      var i = 0;
      function tick() {
        cb(i);
        i++;
        if (i < count) {
          requestAnimationFrame(tick);
        } else {
          resolve({ gridDelta: gridDraws - startGrid, trackDelta: trackDraws - startTrack, frames: i });
        }
      }
      requestAnimationFrame(tick);
    });
  }

  // Observes frames until the predicate is satisfied or the frame budget runs
  // out. The speed-gated acceleration phase uses it because a fixed frame
  // budget would depend on the render rate (the fixed timestep advances the
  // simulation in wall-clock time, not per frame), while the measured speed
  // is render-rate independent.
  function observeUntil(predicate, maxFrames, cb) {
    return new Promise(function (resolve) {
      var startGrid = gridDraws, startTrack = trackDraws;
      var i = 0;
      function tick() {
        cb(i);
        i++;
        // The predicate is evaluated on EVERY observed frame, including the
        // last one inside the budget, so the reported `satisfied` flag is
        // exact (a target first reached on the final budget frame counts).
        var satisfied = i <= maxFrames ? predicate() : false;
        if (!satisfied && i < maxFrames) {
          requestAnimationFrame(tick);
        } else {
          resolve({
            gridDelta: gridDraws - startGrid,
            trackDelta: trackDraws - startTrack,
            frames: i,
            satisfied: satisfied
          });
        }
      }
      requestAnimationFrame(tick);
    });
  }

  function readSpeed(label) {
    var t = label ? label.textContent : '';
    var m = t.match(/(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  }

  function pickWheelBufferId() {
    var bestId = null;
    var bestCount = 0;
    wheelBufferIdsSeen.forEach(function (count, id) {
      if (count > bestCount) {
        bestCount = count;
        bestId = id;
      }
    });
    return bestId;
  }

  // The lit-draw stream is shared by the track lit program, the right-world
  // prop program and the car lit program, so a positional index no longer
  // identifies the car wheel draw. The car lit program is the only lit
  // program that declares uApplyTireGradient, and that uniform is 0 for the
  // body mesh and 1 for the wheel meshes, so the first car lit draw with
  // the gradient enabled IS the wheel draw.
  function pickWheelBufferIdThisFrame() {
    for (var i = 0; i < litDrawBufferIdsThisFrame.length; i++) {
      if (litDrawIsCarLitThisFrame[i] && litApplyThisFrame[i] > 0.5) {
        return litDrawBufferIdsThisFrame[i];
      }
    }
    return null;
  }

  // The per-frame capture arrays are parallel (buffer id, tire-gradient
  // value, car-lit flag), so they are cleared together.
  function resetFrameCapture() {
    carLitModelsThisFrame.length = 0;
    litDrawBufferIdsThisFrame.length = 0;
    litApplyThisFrame.length = 0;
    litDrawIsCarLitThisFrame.length = 0;
  }

  function analyzeWheelShading() {
    var id = pickWheelBufferId();
    if (!id) return { ok: false, error: 'no wheel buffer id captured' };
    var data = bufferDataMap.get(id);
    if (!data) return { ok: false, error: 'wheel buffer data missing' };
    if (data.length % 9 !== 0) return { ok: false, error: 'unexpected wheel buffer stride' };
    var n = data.length / 9;
    var upperSum = 0, upperCount = 0, lowerSum = 0, lowerCount = 0;
    for (var i = 0; i < n; i++) {
      var y = data[i * 9 + 1];
      var r = data[i * 9 + 3];
      var g = data[i * 9 + 4];
      var b = data[i * 9 + 5];
      var brightness = Math.max(r, g, b);
      if (y > 0) { upperSum += brightness; upperCount++; }
      else if (y < 0) { lowerSum += brightness; lowerCount++; }
    }
    if (upperCount === 0 || lowerCount === 0) return { ok: false, error: 'missing upper/lower vertices' };
    var upperAvg = upperSum / upperCount;
    var lowerAvg = lowerSum / lowerCount;

    // The car lit program is the ONLY lit program that declares
    // uApplyTireGradient (the track lit program and the right-world prop
    // program do not), so it identifies the car shader source unambiguously.
    var litSrc = '';
    programSources.forEach(function (src) {
      if (src.indexOf('shadeLitSurface') !== -1 && src.indexOf('uApplyTireGradient') !== -1) {
        litSrc = src;
      }
    });
    var fixedSpaceShader = litSrc.indexOf('uApplyTireGradient') !== -1 &&
      litSrc.indexOf('uTireGradientRadius') !== -1 &&
      litSrc.indexOf('uModel[3][1]') !== -1 &&
      litSrc.indexOf('uSunDirection') !== -1;

    // The shader uses the shared uSunDirection so the highlight follows a
    // fixed top-front light direction while the wheel spins through it.
    // Only the CAR lit draws carry the tire-gradient contract: the track lit
    // program and the right-world prop program never feed
    // uApplyTireGradient, so their draws are excluded from the sequence.
    // Each car contributes one group of five draws - the body mesh without
    // the gradient (0) followed by the four wheel meshes with it (1).
    var seq = carLitApplySequence;
    var groups = [];
    var currentGroup = null;
    for (var gi = 0; gi < seq.length; gi++) {
      if (seq[gi] <= 0.5 || currentGroup === null) {
        currentGroup = [seq[gi]];
        groups.push(currentGroup);
      } else {
        currentGroup.push(seq[gi]);
      }
    }
    // A trailing group may be truncated when the sampling stopped between
    // the body draw and the last wheel draw, so it is ignored.
    if (groups.length > 0 && groups[groups.length - 1].length < 5) groups.pop();
    var patternOk = groups.length > 0 && groups.every(function (group) {
      return group.length === 5 &&
        group[0] === 0 && group[1] === 1 && group[2] === 1 && group[3] === 1 && group[4] === 1;
    });

    return {
      ok: true,
      upperAvg: upperAvg,
      lowerAvg: lowerAvg,
      gradient: upperAvg - lowerAvg,
      fixedSpaceShader: fixedSpaceShader,
      tireGradientPatternOk: patternOk,
      tireGradientApplySequence: seq.slice(0, 16)
    };
  }

  function getShadowMaxAlpha() {
    var shadowSrc = '';
    programSources.forEach(function (src) {
      if (src.indexOf('uShadowColor') !== -1) shadowSrc = src;
    });
    var m = shadowSrc.match(/kShadowMaxAlpha\s*=\s*([\d.]+);/);
    return m ? parseFloat(m[1]) : 0;
  }

  async function runChecks() {
    try {
      await loadBundle();
      result.neatRacingStartDefined = typeof window.neatRacingStart === 'function';
      if (!result.neatRacingStartDefined) throw new Error('neatRacingStart not defined');
      window.neatRacingStart('neatracing-output');
      var canvas = document.getElementById('neatracing-canvas');
      var hudContainer = document.getElementById('neatracing-hud-output');
      result.canvasMounted = !!canvas;
      result.hudMounted = !!(hudContainer && hudContainer.childElementCount > 0);
      result.webglOk = !!(canvas && canvas.getContext('webgl2'));

      await sleep(700);
      result.modeSwitchedToManual = setManualMode();
      if (!result.modeSwitchedToManual) {
        result.consoleErrors.push('mode selector not found');
      }
      await sleep(600);
      carLitModelsThisFrame.length = 0;

      var speedLabel = hudContainer ? hudContainer.querySelector('div > div') : null;

      var steerSamplesA = [], steerSamplesD = [];
      dispatchKey('KeyA', true);
      var obsA = await observeFrames(12, function (frameIndex) {
        if (frameIndex >= 3 && frameIndex <= 9) {
          var models = carLitModelsThisFrame.slice();
          if (models.length >= 5) {
            steerSamplesA.push(yawFromMatrix(models[1]) - yawFromMatrix(models[3]));
            // AC-078 baseline: the rear-left tire is rigidly attached to the
            // body, so at rest (no drift) its relative yaw and its offset
            // heading are the constants the drift phase must preserve.
            relativeYawA.push(
              wrapAngle(yawFromMatrixColumn3(models[3]) - yawFromMatrixColumn3(models[0]))
            );
            relativeOffsetA.push(
              wrapAngle(
                offsetAngle(models[3][12] - models[0][12], models[3][14] - models[0][14]) -
                yawFromMatrixColumn3(models[0])
              )
            );
          }
        }
        var candidate = pickWheelBufferIdThisFrame();
        if (candidate) {
          wheelBufferIdsSeen.set(candidate, (wheelBufferIdsSeen.get(candidate) || 0) + 1);
        }
        resetFrameCapture();
      });
      dispatchKey('KeyA', false);
      await sleep(150);
      dispatchKey('KeyD', true);
      var obsD = await observeFrames(12, function (frameIndex) {
        if (frameIndex >= 3 && frameIndex <= 9) {
          var models = carLitModelsThisFrame.slice();
          if (models.length >= 5) {
            steerSamplesD.push(yawFromMatrix(models[1]) - yawFromMatrix(models[3]));
          }
        }
        var candidate = pickWheelBufferIdThisFrame();
        if (candidate) {
          wheelBufferIdsSeen.set(candidate, (wheelBufferIdsSeen.get(candidate) || 0) + 1);
        }
        resetFrameCapture();
      });
      dispatchKey('KeyD', false);
      await sleep(150);

      var startBody = null, endBody = null;
      // AC-078: the arcade drift only engages above 15 m/s (54 km/h), so the
      // scenario accelerates on the road (throttle only) until the HUD speed
      // passes the drift gate before the W+A phase starts. Without this phase
      // the W+A phase never reaches the drift speed and the tire-yaw contract
      // would be measured at rest (a vacuous pass).
      dispatchKey('KeyW', true);
      var obsAccel = await observeUntil(function () {
        return readSpeed(speedLabel) >= ACCEL_TARGET_SPEED_KMH;
      }, ACCEL_MAX_FRAMES, function (frameIndex) {
        var accelSpeed = readSpeed(speedLabel);
        if (accelSpeed > maxSpeedKmhAccel) maxSpeedKmhAccel = accelSpeed;
        var candidate = pickWheelBufferIdThisFrame();
        if (candidate) {
          wheelBufferIdsSeen.set(candidate, (wheelBufferIdsSeen.get(candidate) || 0) + 1);
        }
        resetFrameCapture();
      });
      dispatchKey('KeyA', true);
      var obsWA = await observeFrames(100, function (frameIndex) {
        var models = carLitModelsThisFrame.slice();
        if (models.length >= 1) {
          var m = models[0];
          var pos = { x: m[12], z: m[14], yaw: yawFromMatrix(m) };
          if (frameIndex === 8) startBody = pos;
          if (frameIndex === 92) endBody = pos;
          // AC-078: the drift proxy compares the body's rendered yaw with the
          // direction of travel. A sliding car travels at a different angle
          // than it points, so the proxy proves the drift engaged (reaching
          // the drift speed alone does not prove a slide).
          //
          // The travel direction comes from a chord across a rolling window
          // of body samples, and the yaw anchor is the mean of the two
          // ENDPOINT yaws, so the mid-window sampling lag of the yaw rate
          // cancels exactly instead of being mistaken for a slide.
          var bodyYawRad = yawFromMatrixColumn3(m);
          var lastSample = driftProxySamples.length > 0
            ? driftProxySamples[driftProxySamples.length - 1]
            : null;
          var unwrappedYaw = lastSample
            ? lastSample.unwrapped + wrapAngle(bodyYawRad - lastSample.yaw)
            : bodyYawRad;
          driftProxySamples.push({
            x: pos.x,
            z: pos.z,
            yaw: bodyYawRad,
            unwrapped: unwrappedYaw
          });
          if (driftProxySamples.length > DRIFT_PROXY_WINDOW) driftProxySamples.shift();
          if (driftProxySamples.length >= 3) {
            var oldestSample = driftProxySamples[0];
            var newestSample = driftProxySamples[driftProxySamples.length - 1];
            var chordDx = newestSample.x - oldestSample.x;
            var chordDz = newestSample.z - oldestSample.z;
            if (chordDx !== 0 || chordDz !== 0) {
              var endpointMidYawRad =
                (oldestSample.unwrapped + newestSample.unwrapped) / 2;
              var proxyRad = Math.abs(
                wrapAngle(endpointMidYawRad - offsetAngle(chordDx, chordDz))
              );
              if (proxyRad > maxDriftProxyRad) maxDriftProxyRad = proxyRad;
              if (proxyRad >= DRIFT_PROXY_MIN_RAD) {
                driftProxyFrameCount += 1;
                driftProxyRunFrames += 1;
                if (driftProxyRunFrames > driftProxyRunMaxFrames) {
                  driftProxyRunMaxFrames = driftProxyRunFrames;
                }
              } else {
                driftProxyRunFrames = 0;
              }
            }
          }
        }
        if (models.length >= 5) {
          // AC-078: the same relative measurements taken during the drift
          // phase; the drift yaw must not split the tires from the body.
          relativeYawWA.push(
            wrapAngle(yawFromMatrixColumn3(models[3]) - yawFromMatrixColumn3(models[0]))
          );
          relativeOffsetWA.push(
            wrapAngle(
              offsetAngle(models[3][12] - models[0][12], models[3][14] - models[0][14]) -
              yawFromMatrixColumn3(models[0])
            )
          );
        }
        // Peak speed over the drift phase: the arcade drift only engages
        // above 15 m/s, so the speed proves the contract was exercised.
        var phaseSpeed = readSpeed(speedLabel);
        if (phaseSpeed > maxSpeedKmhDrift) maxSpeedKmhDrift = phaseSpeed;
        var candidate = pickWheelBufferIdThisFrame();
        if (candidate) {
          wheelBufferIdsSeen.set(candidate, (wheelBufferIdsSeen.get(candidate) || 0) + 1);
        }
        resetFrameCapture();
      });
      dispatchKey('KeyW', false);
      dispatchKey('KeyA', false);
      await sleep(200);

      var vboInfo = analyzeTrackVbo();
      var wheelShading = analyzeWheelShading();
      var avgA = average(steerSamplesA);
      var avgD = average(steerSamplesD);
      // AC-078: the attached tires must follow the body drift angle, so the
      // tire-to-body relative yaw and the tire-to-body offset heading stay
      // at their at-rest baselines while the body yaws into the slide.
      var baselineRelativeYaw = average(relativeYawA);
      var baselineRelativeOffset = average(relativeOffsetA);
      var maxRelativeYawError = 0;
      var maxRelativeOffsetError = 0;
      for (var relYawIndex = 0; relYawIndex < relativeYawWA.length; relYawIndex++) {
        var relYawError = Math.abs(wrapAngle(relativeYawWA[relYawIndex] - baselineRelativeYaw));
        if (relYawError > maxRelativeYawError) maxRelativeYawError = relYawError;
      }
      for (var relOffsetIndex = 0; relOffsetIndex < relativeOffsetWA.length; relOffsetIndex++) {
        var relOffsetError = Math.abs(
          wrapAngle(relativeOffsetWA[relOffsetIndex] - baselineRelativeOffset)
        );
        if (relOffsetError > maxRelativeOffsetError) maxRelativeOffsetError = relOffsetError;
      }
      var tireYawDriftEngaged =
        relativeYawA.length > 0 &&
        relativeYawWA.length > 0 &&
        maxSpeedKmhDrift >= DRIFT_MIN_SPEED_KMH &&
        maxDriftProxyRad >= DRIFT_PROXY_MIN_RAD &&
        driftProxyRunMaxFrames >= DRIFT_PROXY_MIN_FRAMES;
      var yawChange = (startBody && endBody) ? wrapAngle(endBody.yaw - startBody.yaw) : 0;
      var distMoved = (startBody && endBody) ? Math.hypot(endBody.x - startBody.x, endBody.z - startBody.z) : 0;
      var finalSpeed = readSpeed(speedLabel);

      var singleGridA = obsA.gridDelta >= 10 && obsA.gridDelta <= 13;
      var singleGridD = obsD.gridDelta >= 10 && obsD.gridDelta <= 13;
      var singleGridWA = obsWA.gridDelta >= 95 && obsWA.gridDelta <= 103;
      var singleTrackA = obsA.trackDelta >= 10 && obsA.trackDelta <= 13;
      var singleTrackD = obsD.trackDelta >= 10 && obsD.trackDelta <= 13;
      var singleTrackWA = obsWA.trackDelta >= 95 && obsWA.trackDelta <= 103;

      result.checks = {
        bundleLoaded: result.bundleLoaded,
        canvasMounted: result.canvasMounted,
        hudMounted: result.hudMounted,
        modeSwitchedToManual: result.modeSwitchedToManual,
        webglOk: result.webglOk,
        noConsoleErrors: result.consoleErrors.length === 0,
        gridProgramFound: !!gridProgram,
        gridSpacing5m: capturedGridSpacing !== null && Math.abs(capturedGridSpacing - 5.0) < 0.01,
        singleGridPerFrame: singleGridA && singleGridD && singleGridWA,
        trackProgramFound: !!trackProgram,
        trackVboCaptured: !!capturedTrackVboData,
        roadEdgeFlat: vboInfo.noVerticalPillars && vboInfo.flatPaint,
        roadEdgeBorderBands: vboInfo.borderBandsPresent,
        roadEdgeNoPillars: vboInfo.noVerticalPillars,
        topFacesMatteBlack: vboInfo.topFacesMatteBlack,
        noOldRoadCurbColors: vboInfo.noOldRoadCurbColors,
        honeycombContinuous: vboInfo.honeycombContinuous,
        noDoubleBorders: vboInfo.noDoubleBorders,
        borderBandsAt6m: vboInfo.borderBandsAt6m,
        roadEdgeNoBlackOutline: vboInfo.noBlackOutline,
        roadEdgeSinglePlanePaint: vboInfo.singlePlanePaint,
        // One car casts 1 body blob shadow + 4 wheel contact-patch shadows.
        carShadowDrawn: shadowDraws >= 5,
        shadowDark: getShadowMaxAlpha() >= 0.90,
        shadowCoversWheels: shadowModelScales.some(function (s) { return s >= 4.0; }) &&
          shadowModelScales.some(function (s) { return s > 0.1 && s <= 1.0; }),
        wheelTireShading: wheelShading.ok && wheelShading.fixedSpaceShader && wheelShading.tireGradientPatternOk,
        frontWheelSteerAD: (avgA * avgD) < -0.000001 && Math.abs(avgA) > 0.005 && Math.abs(avgD) > 0.005,
        frontWheelSteerMagnitude: Math.abs(avgA) > 0.05 && Math.abs(avgD) > 0.05,
        speedUnderW: finalSpeed > 0,
        driftTurnWA: Math.abs(yawChange) > 0.05 && distMoved > 0.5,
        // AC-078: the ATTACHED tires move and yaw with the body drift angle,
        // so their relative pose to the body is unchanged by the drift.
        tireYawFollowsBodyDuringDrift: tireYawDriftEngaged &&
          maxRelativeYawError <= TIRE_YAW_FOLLOW_TOLERANCE_RAD &&
          maxRelativeOffsetError <= TIRE_YAW_FOLLOW_TOLERANCE_RAD,
        // AC-079: the tires actually LOSE TRACTION proportionally during a
        // full-speed drift. The old model held the whole top speed through a
        // hard turn (the grip floor never let the tire give up more than 30%
        // of its grip and there was no forward traction term at all), so a
        // sustained hard turn that stays below the top-speed ceiling proves
        // the forward grip was spent on the slide.
        proportionalTractionLoss: tireYawDriftEngaged &&
          maxSpeedKmhDrift > 0 &&
          maxSpeedKmhDrift < TRACTION_LOSS_MAX_SPEED_KMH
      };
      result.passed = Object.values(result.checks).every(Boolean);
      result.notes = JSON.stringify({
        gridSpacing: capturedGridSpacing,
        gridDeltas: { A: obsA.gridDelta, D: obsD.gridDelta, ACCEL: obsAccel.gridDelta, WA: obsWA.gridDelta },
        trackDeltas: { A: obsA.trackDelta, D: obsD.trackDelta, ACCEL: obsAccel.trackDelta, WA: obsWA.trackDelta },
        vboSummary: { minY: vboInfo.minY, maxY: vboInfo.maxY, edgeMaxY: vboInfo.edgeMaxY, paintMinY: vboInfo.paintMinY, singlePlanePaint: vboInfo.singlePlanePaint, neonCount: vboInfo.neonCount, red: vboInfo.red, yellow: vboInfo.yellow, green: vboInfo.green, teal: vboInfo.teal, matteCount: vboInfo.matteCount, fillCount: vboInfo.fillCount, edgeCount: vboInfo.edgeCount, topOldColors: vboInfo.topOldColors, topLayerCount: vboInfo.topLayerCount, greenMeanEdge: vboInfo.greenMeanEdge, yellowMeanEdge: vboInfo.yellowMeanEdge, redMeanEdge: vboInfo.redMeanEdge, blackOutlineCount: vboInfo.blackOutlineCount },
        shadowDraws: shadowDraws,
        shadowColor: shadowColorFeeds.length > 0 ? shadowColorFeeds[0] : null,
        shadowMaxAlpha: getShadowMaxAlpha(),
        shadowModelScales: shadowModelScales,
        wheelShading: wheelShading,
        steer: { avgA: avgA, avgD: avgD },
        drift: { yawChange: yawChange, distMoved: distMoved, finalSpeed: finalSpeed },
        tireYawFollow: {
          baselineRelativeYaw: baselineRelativeYaw,
          baselineRelativeOffset: baselineRelativeOffset,
          maxRelativeYawError: maxRelativeYawError,
          maxRelativeOffsetError: maxRelativeOffsetError,
          toleranceRad: TIRE_YAW_FOLLOW_TOLERANCE_RAD,
          driftEngaged: tireYawDriftEngaged,
          maxSpeedKmhDrift: maxSpeedKmhDrift,
          maxSpeedKmhAccel: maxSpeedKmhAccel,
          accelReachedTarget: obsAccel.satisfied,
          maxDriftProxyRad: maxDriftProxyRad,
          driftProxyMinRad: DRIFT_PROXY_MIN_RAD,
          driftProxyWindow: DRIFT_PROXY_WINDOW,
          driftProxyFrames: driftProxyFrameCount,
          driftProxyRunMaxFrames: driftProxyRunMaxFrames,
          driftProxyMinFrames: DRIFT_PROXY_MIN_FRAMES,
          accelFrames: obsAccel.frames,
          accelGridDelta: obsAccel.gridDelta,
          accelTrackDelta: obsAccel.trackDelta,
          baselineSamples: relativeYawA.length,
          driftSamples: relativeYawWA.length
        },
        tractionLoss: {
          maxSpeedKmhDrift: maxSpeedKmhDrift,
          maxSpeedKmhAccel: maxSpeedKmhAccel,
          finalSpeedKmh: finalSpeed,
          maxSpeedCeilingKmh: TRACTION_LOSS_MAX_SPEED_KMH,
          driftEngaged: tireYawDriftEngaged,
          maxDriftProxyRad: maxDriftProxyRad
        }
      });
    } catch (err) {
      result.consoleErrors.push(String(err));
      result.notes = 'Fatal: ' + String(err);
    }
    window.p1TurnDriftGreenSmokeResult = result;
  }

  runChecks();
})();
</script>
</body>
</html>

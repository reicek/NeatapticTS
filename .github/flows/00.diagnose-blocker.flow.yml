id: '00.diagnose-blocker'
name: 'Diagnose and Route a Workflow Blocker'
agent: '00-helping'
description: >
  Universal escape path for any numbered SDLC phase that hits a blocker it
  cannot resolve. Reads the blocker description from the active plan step,
  maps root cause (schema conflict, tool gap, model-routing drift, or
  customization cycle), and either resolves the blocker in place or records
  a learning event and routes to the appropriate numbered agent or specialist.
  This flow is callable from any tier (00–07).

triggers:
  - 'TASK_STATUS: FAILED or PARTIAL with a recorded BLOCKER'
  - 'Cross-tier helper call needed'
  - 'Unknown gate failure requiring root-cause triage'
  - 'Model-routing or frontmatter conflict discovered during implementation'
  - 'Workflow gap identified that no existing skill covers'

gates:
  - 'plan-sync'
  - 'learning-event'

post-phase-fanout:
  - 'learning-event-capturer'
  - '<smallest-relevant-numbered-agent>'

skills:
  - 'capturing-learning-event'
  - 'tracker-handoff'
  - 'agent-frontmatter-standards'
  - 'model-routing-and-budget'

specialists:
  - 'helping-gap-resolution-coordinator'
  - 'helping-agent-maintenance-coordinator'
  - 'Plan Scout'
  - 'failure-triage-specialist'

timeout-minutes: 20

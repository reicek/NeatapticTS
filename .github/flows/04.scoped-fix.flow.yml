id: '04.scoped-fix'
name: 'Scoped Bug or Regression Fix'
agent: '04-implementing'
description: >
  Implements the smallest change that makes a failing test pass. Reads the
  failing test and nearest source boundary, implements a minimal fix, runs
  the coverage guard, and hands off to green-testing for confirmation.
  Suitable for isolated regressions, failing red tests, and single-file bug
  fixes where blast radius is well understood.

triggers:
  - 'Fix a failing test'
  - 'Regression reported in CI'
  - 'Bug fix in a scoped src/ boundary'
  - 'Red test from a previous 03-red-testing step must be made green'

gates:
  - 'plan-sync'
  - 'agent-graph'
  - 'learning-event'
  - 'cortex-first-search'

post-phase-fanout:
  - '05-green-testing'
  - 'coverage-guard'

loop-back: >
  Orchestrator manages the RED→IMPLEMENT→GREEN loop. If green fails,
  orchestrator spawns a new 04-implementing instance with observations.

skills:
  - 'execute'
  - 'coverage-guard'
  - 'test-fix-workflow'

specialists:
  - 'Coverage Guard'
  - 'implementation-pattern-scout'
  - 'implementation-executor'
  - 'performance-trace-specialist'
  - 'browser-ui-specialist'
  - 'browser-memory-specialist'

timeout-minutes: 20

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

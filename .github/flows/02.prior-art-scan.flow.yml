id: "02.prior-art-scan"
name: "Prior Art and Dependency Scan"
agent: "02-researching"
description: >
  Checks whether a planned feature, helper, or pattern already exists in
  the codebase or is constrained by a third-party dependency. Reads
  src/**/*.ts, testing/, benchmarks/, and examples/ selectively to surface
  existing utilities, naming collisions, and import contract boundaries.
  Reads package.json and relevant tsconfig files for dependency and
  module-format constraints. Returns a compact findings block suitable for
  04-implementing to reuse existing patterns instead of duplicating logic.
  Read-only; no file edits permitted.

triggers:
  - "Feature or refactor may duplicate existing helpers"
  - "New module depends on third-party contracts that need verification"
  - "Implementation step asks: does this already exist?"
  - "Naming collision suspected before adding a new export"

gates:
  - "plan-sync"
  - "research-findings-evidence"

post-phase-fanout:
  - "04-implementing"

skills:
  - "plan-alignment"

specialists:
  - "implementation-pattern-scout"
  - "research-codebase-coordinator"
  - "Boundary Mapper"

timeout-minutes: 20

id: '05.coverage-guard'
name: 'Coverage Guard Confirmation'
agent: '05-green-testing'
description: >
  Confirms that every src/ file touched in the current phase maintains 100%
  statements, branches, functions, and lines. Runs a focused coverage slice
  on the changed file set and reports any regressions as blockers. Required
  before any implementation phase can be marked DONE when src/ was touched.

triggers:
  - 'Any src/ file was touched in the current phase'
  - 'Coverage verification required before marking an implementation step done'
  - '04-implementing returns with FILES_CHANGED containing src/ paths'
  - 'Coverage tranche step completed; full 100% confirmation required'

gates:
  - 'plan-sync'
  - 'green-validation-evidence'
  - 'cortex-first-search'

post-phase-fanout:
  - '07-logging'

skills:
  - 'coverage-guard'
  - 'running-unit-tests'

specialists:
  - 'Coverage Guard'
  - 'Coverage Scout'
  - 'test-coverage-analyst'

timeout-minutes: 20

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

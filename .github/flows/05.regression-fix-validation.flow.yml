id: '05.regression-fix-validation'
name: 'Regression Fix Validation'
agent: '05-green-testing'
description: >
  Validates that a regression fix implemented by 04-implementing has restored
  the expected behavior. Runs a targeted Jest slice on the previously failing
  test file, confirms it is now green, confirms no new failures were introduced,
  and records the result as evidence in the plan. If the fix is incomplete,
  routes back to 04-implementing with the remaining failure output.

triggers:
  - 'Regression introduced in a previous phase; fix has been implemented'
  - '04-implementing returns with a regression repair; targeted validation needed'
  - 'Specific failing test path identified; focused slice validation preferred over full suite'
  - 'Regression fix must be confirmed green before the phase log can be written'

gates:
  - 'plan-sync'
  - 'green-validation-evidence'
  - 'cortex-first-search'

post-phase-fanout:
  - '07-logging'

loop-back: >
  If green validation fails, return observations to the orchestrator for
  a NEW 04-implementing instance.

skills:
  - 'execute'
  - 'running-unit-tests'
  - 'triaging-test-failures'

specialists:
  - 'performance-trace-specialist'
  - 'browser-ui-specialist'
  - 'browser-memory-specialist'

timeout-minutes: 15

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

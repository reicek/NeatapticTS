id: '05.test-triage'
name: 'Test Failure Triage'
agent: '05-green-testing'
description: >
  Triages one or more failing tests after an implementation step completes.
  Reads the failure output, maps ownership to the smallest implementing agent
  or script, and either routes for a regression fix or escalates to 00-helping
  when the failure is unresolvable. Does not implement fixes directly.

triggers:
  - 'Implementation step completed and one or more tests are failing'
  - 'CI reports a failing suite after a merge or code change'
  - 'Test failure ownership is unclear after 04-implementing returns'
  - 'Multiple test failures need a triage pass before repair routing'

gates:
  - 'plan-sync'
  - 'green-validation-evidence'
  - 'cortex-first-search'

post-phase-fanout:
  - '04-implementing'

skills:
  - 'triaging-test-failures'
  - 'test-fix-workflow'
  - 'running-unit-tests'

specialists:
  - 'failure-triage-specialist'
  - 'green-test-failure-triage-coordinator'
  - 'code-quality-auditor'
  - 'test-coverage-analyst'

timeout-minutes: 15

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

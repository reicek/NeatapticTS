id: '04.coverage-repair'
name: 'Coverage Tranche Expansion'
agent: '04-implementing'
description: >
  Expands test coverage for a specific source boundary toward 100% statements,
  branches, functions, and lines. Reads the lcov gap from coverage/lcov.info
  or a focused coverage run, adds the smallest owner-local tests that exercise
  uncovered paths, and confirms 100% on the touched files before handing off
  to the coverage guard. Does not fix failing tests; use 04.scoped-fix for that.

triggers:
  - 'Coverage below 100% on a src/ file'
  - 'Coverage tranche needed for a touched boundary'
  - 'Uncovered branch or function detected after implementation'
  - 'Coverage guard reports a gap after a code change'

gates:
  - 'plan-sync'
  - 'agent-graph'
  - 'learning-event'
  - 'cortex-first-search'

post-phase-fanout:
  - '05-green-testing'
  - 'coverage-guard'

loop-back: >
  Orchestrator manages the RED→IMPLEMENT→GREEN loop. If green fails,
  orchestrator spawns a new 04-implementing instance with observations.

skills:
  - 'execute'
  - 'coverage-tranche'
  - 'coverage-guard'

specialists:
  - 'Coverage Scout'
  - 'Coverage Guard'
  - 'unit-test-writer'
  - 'test-coverage-analyst'
  - 'performance-trace-specialist'
  - 'browser-ui-specialist'
  - 'browser-memory-specialist'

timeout-minutes: 30

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

id: '01.blocker-routing'
name: 'Blocker Triage and Routing'
agent: '01-planning'
description: >
  Triages a recorded blocker in the active step and routes it to the
  smallest relevant numbered agent or to 00-helping if the blocker is
  cross-tier. Pulls current plan state via neataptic-workflow-mcp:
  get_active_workflow_snapshot first to read the blocker description without
  opening files manually. Emits a revised step packet or an explicit
  BLOCKED output with SUGGESTED_NEXT_AGENT. Does not attempt to resolve
  implementation or test failures directly.

triggers:
  - 'Blocker recorded in active step with no clear next action'
  - 'TASK_STATUS: PARTIAL or FAILED in the previous agent output'
  - 'Gate failure with no viable forward path triggers 00-helping escalation'
  - 'User asks to triage or unblock a stalled plan step'

gates:
  - 'plan-sync'
  - 'planning-output-contract'

post-phase-fanout:
  - '00-helping'
  - '<smallest-relevant-numbered-agent>'

skills:
  - 'plan-alignment'
  - 'tracker-handoff'
  - 'phase-handoff-workflow'

specialists:
  - 'Plan Scout'
  - 'planning-risk-coordinator'
  - 'helping-gap-resolution-coordinator'
  - 'research-synthesis-specialist'

timeout-minutes: 15

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

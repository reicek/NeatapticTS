id: "03.regression-capture-red"
name: "Regression Capture"
agent: "03-red-testing"
description: >
  Authors a failing test that reproduces a reported bug or CI failure before
  any fix is applied. Reads the bug report or CI failure output, identifies
  the minimal input that triggers the failure, and writes a focused red test
  in the nearest owner-local test file. Confirms the test is red against the
  current codebase without modifying any src/ file. Records the test file
  path and failure reason in the active plan step so 04-implementing has
  a precise regression target.

triggers:
  - "Bug reported in an issue or by the user with no reproducing test"
  - "CI failure in a recently merged change without a targeted test"
  - "Regression introduced by a refactor that broke an implicit invariant"
  - "Existing test suite is green but observable behavior is wrong"

gates:
  - "plan-sync"
  - "red-test-confirmation"

post-phase-fanout:
  - "04-implementing"

skills:
  - "creating-unit-tests"
  - "red-test-contracts"
  - "triaging-test-failures"

specialists:
  - "unit-test-writer"
  - "failure-triage-specialist"

timeout-minutes: 20

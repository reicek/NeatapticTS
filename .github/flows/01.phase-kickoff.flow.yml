id: "01.phase-kickoff"
name: "Phase Kickoff and Step Packet Authoring"
agent: "01-planning"
description: >
  Converts a new phase objective into numbered step packets ready for
  downstream SDLC agents. Pulls the current plan state via the MCP workflow
  snapshot first (neataptic-workflow-mcp: get_active_workflow_snapshot),
  then reads the plan file directly only if the snapshot is stale or
  unavailable. Selects the Plan Scout only when registration or roadmap
  placement is uncertain. Emits paste-ready step packets covering
  01-planning through 07-logging, with explicit skipped-step records
  where a red, green, docs, or logging step adds no value.

triggers:
  - "New phase objective approved and plan has no step packets yet"
  - "Phase transition needed after previous phase marked [DONE]"
  - "User asks 01-planning to start a new migration phase"
  - "Plan tracker has a NEXT: item pointing to a new phase start"

gates:
  - "plan-sync"
  - "step-packet"
  - "planning-output-contract"

post-phase-fanout:
  - "02-researching"
  - "04-implementing"

skills:
  - "plan-alignment"
  - "tracker-handoff"
  - "phase-handoff-workflow"
  - "plan-sync-validation"

specialists:
  - "Plan Scout"
  - "planning-risk-coordinator"
  - "planning-test-strategy-coordinator"
  - "Plan Registration Auditor"

timeout-minutes: 25

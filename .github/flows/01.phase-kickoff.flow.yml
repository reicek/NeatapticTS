id: '01.phase-kickoff'
name: 'Phase Kickoff and Step Packet Authoring'
agent: '01-planning'
description: >
  Converts a new phase objective into a paste-ready phase-level YAML block
  plus `placeholder_steps` describing the phase step sequence. The
  orchestrator MUST stop after a phase block is pasted; it does NOT auto-expand
  the phase (`expansion: steps`, `auto_expand: false`). The phase block sets
  `[WIP]`, emits the placeholder step list, and waits for the user to paste the
  next step packet. Once a step packet is pasted, the orchestrator uses
  `01.step-expansion` if the step has `expansion: slices` and `auto_expand:
  true`, otherwise it routes directly to the `goal`-derived agent. Pulls the
  current plan state via the MCP workflow snapshot first, then reads the plan
  file directly if the snapshot is stale or unavailable. Requires that any
  previous phase already marked [DONE] has been compressed to a concise
  coverage note before the new phase is started (phase-compression gate).

triggers:
  - 'Phase block with expansion: steps and auto_expand: false needs placeholder_steps'
  - 'Phase transition needed after previous phase marked [DONE]'
  - 'User asks 01-planning to start a new phase'
  - 'Plan tracker has a NEXT: item pointing to a new phase start'
  - 'Legacy phase block detected without expansion or with agent/agent_file (halt and run legacy-plan-format gate)'

gates:
  - 'plan-sync'
  - 'step-packet'
  - 'planning-output-contract'
  - 'phase-compression'

entry-checks:
  - 'Spec-Kit clarification cap: active plan/spec contains no more than 3 `NEEDS CLARIFICATION` markers; otherwise halt and run `01.acceptance-criteria` or escalate via `00.cross-tier-helper`.'

exit-checks:
  - 'Five-question limit: at most 5 focused clarification questions have been asked; all accepted answers are appended to the append-only `## Clarifications` section for append-only convergence.'
  - 'constitution_check: the phase objective and placeholder steps align with plans/constitution.md before the phase is considered kicked off.'

post-phase-fanout:
  - '02-researching'
  - '04-implementing'

skills:
  - 'plan-alignment'
  - 'tracker-handoff'
  - 'phase-handoff-workflow'
  - 'plan-sync-validation'

specialists:
  - 'Plan Scout'
  - 'planning-risk-coordinator'
  - 'Plan Registration Auditor'

timeout-minutes: 25

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

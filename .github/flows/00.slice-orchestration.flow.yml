id: '00.slice-orchestration'
name: 'Slice Orchestration'
agent: '00-helping'
description: >
  Orchestrates per-slice implementation lifecycle for large implementation
  steps. Agent Zero routes to this flow when a step packet contains slices.
  The flow's specialist (slice-orchestration-scheduler) prepares per-slice
  execution packets and collects validation evidence; the parent agent
  (00-helping) dispatches each slice to 04-implementing and 05-green-testing
  in sequence, retries failures, and fans out to 06-documenting when all
  slices pass.

triggers:
  - 'Step packet contains slices'
  - 'Plan requests slice orchestration'
  - 'Manual request: orchestrate slices for a large step'

gates:
  - 'plan-sync'
  - 'step-packet'
  - 'cortex-index'
  - 'agent-quality'

post-phase-fanout:
  - '06-documenting'

skills:
  - 'phase-handoff-workflow'
  - 'subagent-delegation-patterns'
  - 'tracker-handoff'

specialists:
  - 'slice-orchestration-scheduler'

search-policy:
  broad-discovery: 'neataptic-cortex-mcp: search_corpus (BM25 corpus index, preferred for plan and step-packet queries)'
  exact-match: 'grep_search or file_search (for exact slice_id, status markers, or plan file paths)'
  freshness-gate: 'neataptic-cortex-mcp: freshness_check — required before broad discovery when session follows corpus-changing work'
  fallback: 'semantic_search + grep_search when Cortex MCP is unavailable or freshness_check reports stale index'
  residual-gap: 'invoke repo-cortex-scout after task if index was stale and could not be rebuilt mid-task'

timeout-minutes: 60

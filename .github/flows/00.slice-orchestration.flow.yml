id: '00.slice-orchestration'
name: 'Slice Orchestration'
agent: '00-helping'
description: >
  Orchestrates per-slice implementation lifecycle for large implementation
  steps. Agent Zero routes to this flow after `01.step-expansion` has expanded
  a pasted step packet into full slices. The flow's specialist
  (slice-orchestration-scheduler) prepares per-slice execution packets and
  collects validation evidence; the parent agent (00-helping) dispatches each
  slice to the `goal`-derived phase agent (red → 03, implement → 04, green →
  05) in sequence, retries failures, and fans out to 06-documenting when all
  slices pass. Slices declare `goal`, `status`, `dependencies`, and
  `next_slice` so the scheduler can order them deterministically.

triggers:
  - 'Step packet with expansion: slices and auto_expand: true has been expanded'
  - '01.step-expansion flow produced slice packets ready for dispatch'
  - 'Plan requests slice orchestration after step expansion'
  - 'Manual request: orchestrate slices for a large step'

gates:
  - 'plan-sync'
  - 'step-packet'
  - 'cortex-index'
  - 'agent-quality'

post-phase-fanout:
  - '06-documenting'

skills:
  - 'phase-handoff-workflow'
  - 'subagent-delegation-patterns'
  - 'tracker-handoff'

specialists:
  - 'slice-orchestration-scheduler'

search-policy:
  broad-discovery: 'cortex: search_corpus (BM25 corpus index, preferred for plan and step-packet queries)'
  exact-match: 'grep_search or file_search (for exact slice_id, status markers, or plan file paths)'
  freshness-gate: 'cortex: freshness_check — required before broad discovery when session follows corpus-changing work'
  fallback: 'semantic_search + grep_search when Cortex MCP is unavailable or freshness_check reports stale index'
  residual-gap: 'invoke repo-cortex-scout after task if index was stale and could not be rebuilt mid-task'

timeout-minutes: 60

id: '04.refactor'
name: 'SOLID-Bounded Module Refactor'
agent: '04-implementing'
description: >
  Executes a deliberate SOLID module split or structural refactor within a
  declared boundary. Reads the boundary map from the plan or Boundary Mapper
  scout, implements the split following the repo naming convention, runs the
  agent-graph gate to verify delegation references, and hands off to
  green-testing for suite confirmation. Does not modify src/ public API.

triggers:
  - 'Refactor a large module'
  - 'SOLID split requested'
  - 'Folderize a file into a module boundary'
  - 'Implement a declared split plan step'

gates:
  - 'plan-sync'
  - 'step-packet'
  - 'agent-graph'
  - 'cortex-first-search'

post-phase-fanout:
  - '05-green-testing'

loop-back: >
  Orchestrator manages the RED→IMPLEMENT→GREEN loop. If green fails,
  orchestrator spawns a new 04-implementing instance with observations.

skills:
  - 'execute'
  - 'solid-split'
  - 'coverage-guard'

specialists:
  - 'Boundary Mapper'
  - 'Coverage Guard'
  - 'implementation-pattern-coordinator'
  - 'implementation-executor'
  - 'performance-trace-specialist'
  - 'browser-ui-specialist'
  - 'browser-memory-specialist'

timeout-minutes: 45

search-policy:
  primary: cortex-mcp
  fallback: native-tools
  tools:
    - freshness_check
    - search_corpus
    - search_advanced
    - search_context
    - load_chunk
    - load_document
    - traverse_graph
    - expand_query
  description: 'Cortex RAG is the primary search mechanism. Use Cortex MCP tools first; fall back to grep/glob/view only when Cortex is degraded or target is a known file path.'

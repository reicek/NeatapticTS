name: NEATchat snapshot guard

on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/neatChat/generate-default-pretrained-session-snapshot.ts'
      - 'examples/neatChat/default-pretraining-corpus.ts'
      - 'examples/neatChat/sample-conversation.ts'
  push:
    branches: [develop]
    paths:
      - 'examples/neatChat/generate-default-pretrained-session-snapshot.ts'
      - 'examples/neatChat/default-pretraining-corpus.ts'
      - 'examples/neatChat/sample-conversation.ts'

jobs:
  verify-neat-chat-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate default NEATchat snapshot
        run: npm run generate:neat-chat-default-snapshot

      - name: Verify snapshot is committed
        run: |
          set -e
          SNAPSHOT_STATUS="$(git status --porcelain -- examples/neatChat/default-pretrained-session-snapshot.ts)"
          if [ -n "$SNAPSHOT_STATUS" ]; then
            echo "ERROR: examples/neatChat/default-pretrained-session-snapshot.ts is stale."
            echo "Run 'npm run generate:neat-chat-default-snapshot' and commit the updated file."
            echo "Git status entry: $SNAPSHOT_STATUS"
            git --no-pager diff -- examples/neatChat/default-pretrained-session-snapshot.ts
            exit 1
          fi
